  - name: Public
    description: No authentication required
  - name: System
    description: Service liveness and dependency readiness
  - name: Prices
    description: Historical and latest oracle price data
  - name: DEX Markets
    description: Reviewed execution-market evidence, separate from oracle consensus
  - name: Consensus
    description: Cross-oracle consensus pricing 🔒
  - name: Feeds
    description: Oracle feed registry, health, and freshness
  - name: Reputation
    description: Oracle provider reputation scores and rankings
  - name: Risk
    description: Composite risk metrics 🔒
  - name: Protocols
    description: Lending protocol risk parameters and oracle exposure 🔒
  - name: Safety
    description: Liquidation stress tests and position safety 🔒
  - name: Analytics
    description: Deviation, correlation, signals, latency, anomalies 🔒
  - name: Risk Signals
    description: Peg Risk for stablecoins and wrapped/LST assets, plus incidents
  - name: Oracle Watch
    description: Signed oracle monitoring signals and history
  - name: Data
    description: Snapshots, exports, and daily reports
  - name: Execution Evidence
    description: Issue, retrieve, and independently verify signed execution receipts

security: []

paths:
  /rwa/assessment:
    post:
      operationId: assessRwaEvidence
      tags: [Safety]
      summary: Unsigned RWA evidence diagnostic
      description: Evaluates caller-supplied instrument, exact-call scope, quotes, market state and issuer evidence against an explicit policy. Does not authenticate inputs or authorize execution. Uses the separate insight.rwa-report.v1 family; existing pre-trade receipts are unchanged.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './rwa-assessment.schema.json'
      responses:
        '200':
          description: Diagnostic envelope; data.mode is diagnostic, data.mayAuthorizeExecution is false, data.evidenceProvenance is caller-supplied-unverified, and data.report contains recomputable evaluation.
        '400':
          description: Invalid input or unsupported policy semantics
        '401':
          description: API key required
  /rwa/robinhood/context:
    get:
      operationId: getRobinhoodRwaContext
      tags: [Safety]
      summary: Robinhood Stock Token issuer context
      description: >-
        Returns first-party Robinhood Assets (Jersey) Limited metadata, trading
        capabilities, halt state, corporate actions, multiplier-normalized
        reference price, and an optional on-chain ERC-8056 cross-check. This is
        issuer context, not an independent oracle observation: it never counts
        toward oracle quorum and never authorizes execution.
      security:
        - apiKey: []
      parameters:
        - in: query
          name: symbol
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z][A-Za-z0-9.-]{0,15}$'
          example: AAPL
        - in: query
          name: verifyOnchain
          required: false
          schema:
            type: boolean
            default: true
          description: Cross-check uiMultiplier, pending multiplier, effective time, and oraclePaused on Robinhood Chain.
      responses:
        '200':
          description: Non-authorizing first-party issuer context with explicit provenance and quorum exclusion.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required:
                      [
                        schema,
                        source,
                        asset,
                        quote,
                        multiplier,
                        priceNormalization,
                        verification,
                        corporateActions,
                        marketEvidence,
                        integrity,
                      ]
                    properties:
                      schema:
                        type: string
                        const: insight.robinhood-rwa-context.v1
                      source:
                        type: object
                        description: First-party issuer provenance; independent and countsTowardOracleQuorum are always false.
                        required: [id, type, independent, countsTowardOracleQuorum, issuer]
                        properties:
                          id:
                            type: string
                            const: robinhood-rhj
                          type:
                            type: string
                            const: issuer-first-party
                          independent:
                            type: boolean
                            const: false
                          countsTowardOracleQuorum:
                            type: boolean
                            const: false
                          issuer:
                            type: string
                            const: Robinhood Assets (Jersey) Limited
                      asset:
                        type: object
                        required:
                          [id, tokenSymbol, tokenName, status, currentMultiplier, deployment]
                        properties:
                          id:
                            type: string
                            pattern: '^0x[0-9a-fA-F]{64}$'
                          tokenSymbol:
                            type: string
                          tokenName:
                            type: string
                          status:
                            type: string
                          currentMultiplier:
                            type: string
                          pendingMultiplier:
                            type: [string, 'null']
                          deployment:
                            type: object
                      quote:
                        type: object
                        required:
                          [tokenSymbol, bid, ask, currency, generatedAt, midpointUsd, ageSeconds]
                        properties:
                          tokenSymbol:
                            type: string
                          bid:
                            type: string
                          ask:
                            type: string
                          currency:
                            type: string
                            const: USD
                          generatedAt:
                            type: string
                            format: date-time
                          midpointUsd:
                            type: string
                          ageSeconds:
                            type: [integer, 'null']
                      multiplier:
                        type: object
                        required:
                          [decimals, apiCurrent, apiCurrentAtomic, onchain, currentMatchesOnchain]
                        properties:
                          decimals:
                            type: integer
                            const: 18
                          apiCurrent:
                            type: string
                          apiCurrentAtomic:
                            type: string
                          currentMatchesOnchain:
                            type: [boolean, 'null']
                          onchain:
                            type: object
                            required: [attempted, available, complete, rpcMode, tokenUid]
                            properties:
                              attempted:
                                type: boolean
                              available:
                                type: boolean
                              complete:
                                type: boolean
                              rpcMode:
                                type: string
                                enum: [configured, public-rate-limited, not-requested]
                              tokenUid:
                                type: [string, 'null']
                      priceNormalization:
                        type: object
                        required:
                          [
                            rawUnderlyingMidUsd,
                            tokenReferencePriceUsd,
                            formula,
                            countsTowardOracleQuorum,
                          ]
                        properties:
                          rawUnderlyingMidUsd:
                            type: string
                          tokenReferencePriceUsd:
                            type: string
                          formula:
                            type: string
                            const: underlying-midpoint * currentMultiplier
                          countsTowardOracleQuorum:
                            type: boolean
                            const: false
                      verification:
                        type: object
                        description: REST/on-chain asset UID and deployment consistency checks.
                        required:
                          [
                            assetIdMatchesOnchain,
                            assetDeploymentRegistered,
                            quoteSymbolMatchesAsset,
                            quoteDeploymentMatchesAsset,
                            corporateActionSymbolsMatchAsset,
                            corporateActionDeploymentsMatchAsset,
                          ]
                        properties:
                          assetIdMatchesOnchain:
                            type: [boolean, 'null']
                          assetDeploymentRegistered:
                            type: boolean
                          quoteSymbolMatchesAsset:
                            type: boolean
                          quoteDeploymentMatchesAsset:
                            type: boolean
                          corporateActionSymbolsMatchAsset:
                            type: boolean
                          corporateActionDeploymentsMatchAsset:
                            type: boolean
                      corporateActions:
                        type: array
                        items:
                          type: object
                      marketEvidence:
                        type: object
                        required: [halt, corporateAction, quoteObservedAt, quoteValidUntil, session]
                        properties:
                          halt:
                            type: string
                            enum: [CLEAR, HALTED, UNKNOWN]
                          corporateAction:
                            type: string
                            enum: [CLEAR, PENDING, UNKNOWN]
                          quoteObservedAt:
                            type: [integer, 'null']
                          quoteValidUntil:
                            type: [integer, 'null']
                          session:
                            type: string
                            const: UNKNOWN
                      integrity:
                        type: object
                        description: CLEAR, CAUTION, or BLOCK consistency status; mayAuthorizeExecution is always false.
                        required: [status, reasonCodes, mayAuthorizeExecution]
                        properties:
                          status:
                            type: string
                            enum: [CLEAR, CAUTION, BLOCK]
                          reasonCodes:
                            type: array
                            items:
                              type: string
                          mayAuthorizeExecution:
                            type: boolean
                            const: false
        '400':
          description: Invalid or unsupported Stock Token symbol
        '401':
          description: API key required
        '502':
          description: Robinhood issuer-context service unavailable or returned invalid data
  /rwa/robinhood/instrument:
    get:
      operationId: getRobinhoodRwaInstrument
      tags: [Safety]
      summary: Resolve and cross-check an RWA instrument identity
      description: >-
        Resolves the committed FIGI/MIC instrument record for a Robinhood Stock
        Token and cross-checks it against current issuer UID, ISIN, chain and
        contract data. Registry entries remain in shadow mode until explicitly
        promoted. This endpoint returns reference master data only: it never
        counts toward oracle quorum and never authorizes execution.
      security:
        - apiKey: []
      parameters:
        - in: query
          name: symbol
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z][A-Za-z0-9.-]{0,15}$'
          example: AAPL
        - in: query
          name: verifyOnchain
          required: false
          schema:
            type: boolean
            default: true
          description: Also cross-check the issuer UID and deployment against Robinhood Chain.
      responses:
        '200':
          description: Non-authorizing FIGI/MIC registry record and issuer identity cross-check.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required:
                      [
                        schema,
                        registryVersion,
                        evaluatedAt,
                        entry,
                        observedIssuerBinding,
                        evaluation,
                      ]
                    properties:
                      schema:
                        type: string
                        const: insight.rwa-instrument-admission.v1
                      registryVersion:
                        type: string
                      evaluatedAt:
                        type: integer
                      entry:
                        type: [object, 'null']
                        description: Committed instrument, FIGI, MIC and issuer binding record.
                      observedIssuerBinding:
                        type: object
                        description: Current issuer UID, ISIN, chain and token contract observation.
                      evaluation:
                        type: object
                        required:
                          [
                            identityStatus,
                            reasonCodes,
                            productionIdentityAdmitted,
                            countsTowardOracleQuorum,
                            mayAuthorizeExecution,
                          ]
                        properties:
                          identityStatus:
                            type: string
                            enum: [MATCH, MISMATCH, NOT_FOUND]
                          reasonCodes:
                            type: array
                            items:
                              type: string
                          productionIdentityAdmitted:
                            type: boolean
                          countsTowardOracleQuorum:
                            type: boolean
                            const: false
                          mayAuthorizeExecution:
                            type: boolean
                            const: false
        '400':
          description: Invalid or unsupported Stock Token symbol
        '401':
          description: API key required
        '502':
          description: Robinhood issuer-context service unavailable or returned invalid data
  /execution/attestation/issue:
    post:
      operationId: issueExecutionReceipt
      tags: [Execution Evidence]
      summary: Issue a durable signed Execution Receipt
      description: Collects settlement facts on chain, verifies both pre-trade gates, signs the result, and durably stores the complete envelope before returning it. Cross-chain settlements and caller-selected post-settlement policies are rejected.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionIssueRequest'
      responses:
        '200':
          description: Receipt signed and persisted
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid or unprovable execution binding
        '503':
          description: Signing or durable persistence unavailable

  /execution/attestation/issue/journey:
    post:
      operationId: redeemSwapIntentReceipt
      tags: [Execution Evidence]
      summary: Redeem the included Swap Intent Execution Receipt
      description: |
        Redeems the single receipt credit created by a settled x402 Swap Intent.
        The caller must present the opaque `journeyId`, its caller-held
        `outcomeToken`, both signed Pre-Trade gates, and the settlement transaction.
        Both gates are signature-verified and must match the journey. This route
        does not accept an API key in place of the one-time capability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ExecutionIssueRequest'
                - type: object
                  required: [journeyId, outcomeToken, destinationPreTradeUid, preTradeAttestations]
                  properties:
                    journeyId:
                      type: string
                      format: uuid
                    outcomeToken:
                      type: string
                      minLength: 32
                      description: Caller-held one-time lifecycle capability; do not log it.
      responses:
        '200':
          description: Signed receipt issued, or the exact same persisted receipt returned idempotently.
        '404':
          description: Unknown journey or invalid caller capability.
        '409':
          description: Settlement is still pending, a receipt is being issued, or the credit is unavailable.
        '503':
          description: Durable receipt finalization temporarily unavailable; retry the identical request.

  /execution/solana/collect:
    post:
      operationId: collectSolanaExecutionFacts
      tags: [Execution Evidence]
      summary: Collect unsigned Solana balance facts
      description: |
        Reads a confirmed Solana mainnet-beta transaction and measures the taker's
        net wallet-owned SPL or Token-2022 balance changes and/or native SOL lamport
        change across the full transaction. This endpoint returns unsigned facts.
        SOL movements include rent, tips and unrelated instructions, so they do not
        produce an attributed execution price.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [signature, sourceAssetId, destinationAssetId, taker]
              properties:
                signature:
                  type: string
                  minLength: 87
                  maxLength: 88
                  description: Base58 Solana transaction signature.
                sourceAssetId:
                  type: string
                  description: CAIP-19 SOL ID solana:0/slip44:501 or SPL/Token-2022 ID solana:0/spl:<mint>.
                destinationAssetId:
                  type: string
                  description: CAIP-19 SOL ID solana:0/slip44:501 or SPL/Token-2022 ID solana:0/spl:<mint>.
                taker:
                  type: string
                  minLength: 32
                  maxLength: 44
                  description: Base58 wallet public key whose token-account and/or lamport changes are measured.
      responses:
        '200':
          description: Collection result; inspect data.collection.ok and data.signed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      signed:
                        type: boolean
                        const: false
                      assertionScope:
                        type: [string, 'null']
                        enum:
                          [
                            NET_WALLET_OWNED_SPL_BALANCE_DELTA,
                            NET_WALLET_LAMPORT_AND_SPL_BALANCE_DELTA,
                            null,
                          ]
                      collection:
                        type: object
                        description: 'Either { ok: true, facts } or { ok: false, code, message }.'
        '400':
          description: Invalid request body
        '401':
          description: API key required
        '402':
          description: Credit balance insufficient

  /execution/solana/receipt:
    post:
      operationId: issueSolanaExecutionReceipt
      tags: [Execution Evidence]
      summary: Issue signed Solana execution evidence
      description: |
        Reads a confirmed mainnet-beta transaction and signs bounded wallet-level
        SPL/Token-2022 and native SOL balance-delta facts with the dedicated Insight
        Ed25519 Solana evidence key. It does not attribute arbitrary instruction
        semantics, venue fills, or SOL transfers. The response includes a SHA-256
        context commitment over the complete signed receipt.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [signature, sourceAssetId, destinationAssetId, taker]
              properties:
                signature:
                  {
                    type: string,
                    minLength: 87,
                    maxLength: 88,
                    description: Base58 Solana transaction signature.,
                  }
                sourceAssetId:
                  { type: string, description: CAIP-19 native SOL or SPL/Token-2022 asset ID. }
                destinationAssetId:
                  { type: string, description: CAIP-19 native SOL or SPL/Token-2022 asset ID. }
                taker:
                  {
                    type: string,
                    minLength: 32,
                    maxLength: 44,
                    description: Base58 wallet whose balance changes are measured.,
                  }
      responses:
        '200':
          description: Ed25519-signed execution evidence and context commitment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [receipt, contextCommitment, signerPublicKey]
                    properties:
                      receipt:
                        {
                          type: object,
                          description: insight.solana-execution-receipt.v1 signed envelope.,
                        }
                      contextCommitment:
                        {
                          type: object,
                          description: SHA-256 commitment over canonical receipt JSON.,
                        }
                      signerPublicKey:
                        {
                          type: string,
                          description: Base58 Ed25519 public key; consumers must independently pin it.,
                        }
        '400': { description: Invalid request or unsupported asset pair. }
        '401': { description: API key required. }
        '402': { description: Credit balance insufficient. }
        '503': { description: Dedicated Solana evidence signer unavailable. }

  /execution/solana/simulate:
    post:
      operationId: simulateSolanaTransaction
      tags: [Execution Evidence]
      summary: Simulate and sign a Solana pre-sign receipt
      description: |
        Simulates an unsigned serialized legacy, v0, or v1 transaction on
        mainnet-beta at confirmed commitment with signature verification disabled.
        All signature slots must be zero. It checks the
        exact message SHA-256 against expectedMessageHash and signs the simulation
        result. Simulation is a state snapshot and does not predict landing or
        subsequent state changes.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [transactionBase64, expectedMessageHash]
              properties:
                transactionBase64:
                  {
                    type: string,
                    minLength: 8,
                    maxLength: 12000,
                    description: Serialized Solana transaction in base64.,
                  }
                expectedMessageHash:
                  {
                    type: string,
                    pattern: '^0x[0-9a-fA-F]{64}$',
                    description: SHA-256 digest of the exact serialized message bytes.,
                  }
      responses:
        '200':
          description: Ed25519-signed simulation evidence and context commitment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [receipt, contextCommitment, signerPublicKey]
                    properties:
                      receipt:
                        {
                          type: object,
                          description: insight.solana-simulation-receipt.v1 signed envelope.,
                        }
                      contextCommitment:
                        {
                          type: object,
                          description: SHA-256 commitment over canonical receipt JSON.,
                        }
                      signerPublicKey:
                        {
                          type: string,
                          description: Base58 Ed25519 public key; consumers must independently pin it.,
                        }
        '400': { description: Invalid/signed transaction or expected message hash mismatch. }
        '401': { description: API key required. }
        '402': { description: Credit balance insufficient. }
        '503': { description: Dedicated Solana evidence signer or RPC unavailable. }

  /execution/attestation/verify:
    post:
      operationId: verifyExecutionReceipt
      tags: [Execution Evidence]
      summary: Verify one Execution Receipt
      description: Recomputes its UID and signature and requires a registry-authorised production signer. Public and unmetered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attestation]
              properties:
                policyId:
                  $ref: '#/components/schemas/ImmutablePartnerPolicyId'
                  description: Optional only for generic or historical verification. Partner production integrations must use the partner-scoped route below.
                attestation:
                  $ref: '#/components/schemas/ExecutionReceipt'
      responses:
        '200':
          description: Verification result; inspect valid, cryptographicValid, trustedAttester, expired and reason

  /execution/attestation/verify-pair:
    post:
      operationId: verifyExecutionPair
      tags: [Execution Evidence]
      summary: Verify the pre-trade → settlement closed loop
      description: Verifies signatures, production-key trust, exact signed bindings, authorising verdicts, and that settlement occurred inside every signed gate window. Historical expired envelopes remain verifiable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preTradeAttestation, executionReceipt]
              properties:
                policyId:
                  $ref: '#/components/schemas/ImmutablePartnerPolicyId'
                  description: Optional only for generic or historical verification. Partner production integrations must use the partner-scoped route below.
                preTradeAttestation:
                  type: object
                  additionalProperties: true
                destinationPreTradeAttestation:
                  type: object
                  additionalProperties: true
                executionReceipt:
                  $ref: '#/components/schemas/ExecutionReceipt'
      responses:
        '200':
          description: Cryptographic closed-loop verification result

  /partners/{partnerId}/execution/attestation/verify:
    parameters:
      - $ref: '#/components/parameters/PartnerId'
    get:
      operationId: getPartnerExecutionVerificationContract
      tags: [Execution Evidence]
      summary: Resolve the policy-mandatory partner verification contract
      description: Returns the exact active policy id and production reachability for this partner path.
      security: []
      responses:
        '200':
          description: Current partner runtime contract
        '400':
          description: Unknown partner id
    post:
      operationId: verifyPartnerExecutionReceipt
      tags: [Execution Evidence]
      summary: Verify one Execution Receipt under the active partner policy
      description: Fails closed unless policyId is the exact immutable policy currently activated for partnerId, production reachability is enabled, and the receipt schema/profile is admitted. The policy is selected by the verifier and is never trusted from receipt data.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policyId, attestation]
              properties:
                policyId:
                  $ref: '#/components/schemas/ImmutablePartnerPolicyId'
                attestation:
                  $ref: '#/components/schemas/ExecutionReceipt'
      responses:
        '200':
          description: Policy-bound verification result; valid is false for stale, cross-partner, disabled, or unadmitted policy input
        '400':
          description: Missing/malformed policy id, partner id, or receipt envelope

  /partners/{partnerId}/execution/attestation/verify-pair:
    parameters:
      - $ref: '#/components/parameters/PartnerId'
    get:
      operationId: getPartnerExecutionPairVerificationContract
      tags: [Execution Evidence]
      summary: Resolve the policy-mandatory partner pair contract
      description: Returns the exact active policy id and production reachability for this partner path.
      security: []
      responses:
        '200':
          description: Current partner runtime contract
        '400':
          description: Unknown partner id
    post:
      operationId: verifyPartnerExecutionPair
      tags: [Execution Evidence]
      summary: Verify the closed loop under the active partner policy
      description: Applies exact partner/policy activation, production reachability, and receipt schema/profile admission in addition to the cryptographic pair checks.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policyId, preTradeAttestation, executionReceipt]
              properties:
                policyId:
                  $ref: '#/components/schemas/ImmutablePartnerPolicyId'
                preTradeAttestation:
                  type: object
                  additionalProperties: true
                destinationPreTradeAttestation:
                  type: object
                  additionalProperties: true
                executionReceipt:
                  $ref: '#/components/schemas/ExecutionReceipt'
      responses:
        '200':
          description: Policy-bound cryptographic closed-loop verification result
        '400':
          description: Missing/malformed policy id, partner id, or receipt envelope

  /partners/{partnerId}/safety/pre-trade:
    parameters:
      - $ref: '#/components/parameters/PartnerId'
    get:
      operationId: issuePartnerPreTradeSafetyGate
      tags: [Safety]
      summary: Issue a policy-bound one-time VERITAS pre-trade gate (inactive candidate)
      description: |
        This candidate route fails closed until the exact immutable VERITAS 1800-second
        policy is separately activated. It also requires the dedicated API-key ID,
        a selected one-time UTC window, the fixed v3 WETH/USDC trade and the
        request/signature cutoffs. The public pre-trade endpoint and registered
        selection rule remain at 600 seconds. A successful call does not authorize
        any Bitcoin or Ethereum broadcast.
      security:
        - apiKey: []
      parameters:
        - name: policyId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ImmutablePartnerPolicyId'
        - name: asset
          in: query
          required: true
          schema:
            type: string
            enum: [WETH, USDC]
        - name: destinationAsset
          in: query
          required: true
          schema:
            type: string
            enum: [WETH, USDC]
        - name: chainId
          in: query
          required: true
          schema:
            type: integer
            enum: [1]
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [swap]
        - name: tradeAmountUsd
          in: query
          required: true
          schema:
            type: number
            enum: [50000]
        - name: schemaVersion
          in: query
          required: true
          schema:
            type: integer
            enum: [3]
      responses:
        '200':
          description: Signed 1800-second v3 gate if every policy and window condition holds
        '400':
          description: Partner, policy, trade, key, or window condition failed
        '402':
          $ref: '#/components/responses/CreditExhausted'

  /execution/attestation/{uid}:
