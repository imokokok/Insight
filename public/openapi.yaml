  /safety/swap-intent:
    get:
      operationId: createPaidSwapIntent
      tags: [Safety]
      summary: Create a two-gate Swap Intent 🔒
      description: |
        The paid x402 path for a transaction-verifiable same-chain swap decision.
        It issues two signed schema-v3 Pre-Trade gates, one for each asset, and
        returns a `journeyId` plus one receipt credit once the x402 payment has
        settled. `venue` and `router` are caller claims, not verified venue facts.
        A `BLOCK` is a complete paid decision. Cross-chain intents are not supported.
      security:
        - apiKey: []
        - {}
      parameters:
        - { name: sourceAsset, in: query, required: true, schema: { type: string, example: ETH } }
        - {
            name: destinationAsset,
            in: query,
            required: true,
            schema: { type: string, example: USDC },
          }
        - { name: subjectChainId, in: query, required: true, schema: { type: integer, example: 1 } }
        - {
            name: settlementChainId,
            in: query,
            required: true,
            schema: { type: integer, example: 1 },
          }
        - {
            name: declaredNotionalUsd,
            in: query,
            required: true,
            schema: { type: number, exclusiveMinimum: 0, example: 1000 },
          }
        - { name: venue, in: query, required: false, schema: { type: string, example: uniswap-v3 } }
        - {
            name: router,
            in: query,
            required: false,
            schema: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' },
          }
      responses:
        '200':
          description: Two signed checks and next actions for receipt redemption or a voluntary non-execution report.
        '402':
          description: x402 v2 quote in PAYMENT-REQUIRED for anonymous calls.
    post:
      operationId: createApiKeySwapIntent
      tags: [Safety]
      summary: Create a two-gate Swap Intent with an API key 🔒
      description: API-key variant of Swap Intent. JSON body uses the same fields as the GET query contract.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  sourceAsset,
                  destinationAsset,
                  subjectChainId,
                  settlementChainId,
                  declaredNotionalUsd,
                ]
              properties:
                sourceAsset: { type: string }
                destinationAsset: { type: string }
                subjectChainId: { type: integer }
                settlementChainId: { type: integer }
                declaredNotionalUsd: { type: number, exclusiveMinimum: 0 }
                venue: { type: string }
                router: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
      responses:
        '200': { description: Two signed gates and a receipt capability. }

  /trade-journeys/outcome:
    post:
      operationId: reportSwapJourneyNotExecuted
      tags: [Execution Evidence]
      summary: Record a voluntary non-execution report
      description: |
        Records a caller statement that it did not execute the checked journey.
        It is intentionally not a claim about chain state: no callback or report
        is ever interpreted as proof that a transaction did not occur.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [journeyId, outcomeToken, reason]
              properties:
                journeyId: { type: string, format: uuid }
                outcomeToken: { type: string, minLength: 32 }
                reason:
                  type: string
                  enum: [risk_caution, market_changed, user_cancelled, integration_failed, other]
      responses:
        '200': { description: Voluntary report recorded. }
        '404': { description: Unknown journey or invalid caller capability. }
        '409': { description: Journey already has an execution or terminal state. }

  /oracle-watch:
    get:
      operationId: oracleWatch
      tags: [Safety]
      summary: Oracle Watch — always-on cross-oracle trust signal 🔒
      description: |
        Always-on companion to the pre-trade safety check. Condenses live cross-oracle
        consensus deviation, agreement, quorum, outliers and staleness into a single
        `NORMAL` / `CAUTION` / `DANGER` verdict with a `proceed` / `proceed_with_caution` /
        `halt` recommendation. Agents should poll this signal to monitor oracle risk for long-running strategies
        (yield, keepers, portfolios) between trades and pause when the verdict turns
        `DANGER`. When an asset has no cross-oracle coverage, the endpoint degrades to a
        `DANGER` / `halt` verdict instead of erroring. Verdict thresholds reuse the pre-trade
        rule set (deviation 1% / 3%, agreement 0.95 / 0.85) so both surfaces speak the same
        severity language.

        **Credit-metered** — any API key with sufficient credit balance.
      security:
        - apiKey: []
      parameters:
        - name: symbol
          in: query
          required: true
          description: Asset symbol, e.g. ETH, BTC.
          schema:
            type: string
            example: ETH
        - name: chain
          in: query
          required: false
          description: Optional blockchain filter, e.g. ethereum, arbitrum, base.
          schema:
            type: string
            example: ethereum
      responses:
        '200':
          description: Oracle Watch verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleWatchResponse'
        '402':
          $ref: '#/components/responses/CreditExhausted'

  /oracle-watch/history:
    get:
      operationId: getOracleWatchHistory
      tags: [Safety]
      summary: Retrospective Oracle Watch credibility trend 🔒
      description: |
        Returns verdict stability, degraded-time ratio, worst deviation, mean credibility,
        and a time series for Oracle Watch. API-key requests receive the full retained
        90-day window on every paid plan. To keep responses bounded and complete, 30-minute
        points are available for windows up to 7 days, 8–30 day windows are rolled up hourly,
        and windows over 30 days are rolled up daily.

        Omitting `chain` selects the global (`chain IS NULL`) series; it does not mix rows
        from multiple blockchains.

        **Credit-metered** — any API key with sufficient credit balance.
      security:
        - apiKey: []
      parameters:
        - name: symbol
          in: query
          required: true
          description: Asset symbol, e.g. ETH, BTC.
          schema:
            type: string
            example: ETH
        - name: chain
          in: query
          required: false
          description: Optional blockchain filter. Omit for the global series.
          schema:
            type: string
            example: arbitrum
        - name: days
          in: query
          required: false
          description: Look-back window. API-key requests are capped at 90 days.
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
        - name: interval
          in: query
          required: false
          description: Requested grain; long windows are automatically rolled up as described above.
          schema:
            type: string
            enum: [30min, hourly, daily]
      responses:
        '200':
          description: Oracle Watch historical credibility trend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleWatchHistoryResponse'
        '402':
          $ref: '#/components/responses/CreditExhausted'

