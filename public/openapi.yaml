  /safety/pre-trade:
    get:
      operationId: preTradeSafetyCheck
      tags: [Safety]
      summary: Pre-trade oracle safety check 🔒
      description: |
        Pre-trade oracle safety checkpoint for AI agents. Call this BEFORE executing any on-chain
        swap/borrow/lend/liquidation/repay to verify oracle data integrity. Aggregates cross-oracle
        consensus prices, per-provider deviation, data freshness, stablecoin peg status, and
        reputation into a single verdict: `PASS` / `CAUTION` / `DANGER` / `BLOCK`. Agents MUST NOT
        execute trades when the verdict is `DANGER` or `BLOCK`. Also returns a recommended maximum
        position size. Every call is audit-logged to build a data flywheel for a future ML model.

        **Ways to pay:** use an API key with sufficient credits, or pay $0.02 USDC per successful
        check through x402. When the deployment has `MPP_ENABLED=true`, the same REST endpoint also
        accepts MPP `evm` `charge` at the same price, network, recipient, and facilitator. Failed
        checks are not settled. The MPP MCP pilot is available at `/api/mcp/mpp` only when
        `MPP_MCP_ENABLED=true`; it accepts `pre_trade_safety_check` and settles only after success.
        The live `/openapi.json` discovery document publishes canonical `x-payment-info.offers`
        using the deployment's actual USDC contract and atomic-unit amount. x402 details remain in
        the separate `x-x402-payment-info` extension.
      security:
        - apiKey: []
        - {}
      parameters:
        - name: asset
          in: query
          required: true
          description: Asset symbol, e.g. ETH, BTC, USDC.
          schema:
            type: string
            example: ETH
        - name: chainId
          in: query
          required: true
          description: Chain ID (e.g. 1=Ethereum, 0=chain-agnostic).
          schema:
            type: integer
            example: 1
        - name: action
          in: query
          required: true
          description: Type of DeFi operation.
          schema:
            type: string
            enum: [swap, borrow, lend, liquidate, repay]
            example: swap
        - name: tradeAmountUsd
          in: query
          required: true
          description: Trade size in USD.
          schema:
            type: number
            format: float
            exclusiveMinimum: 0
            example: 100000
        - name: targetProviders
          in: query
          required: false
          description: Comma-separated list of oracle providers to restrict the check to.
          schema:
            type: string
            example: chainlink,redstone,api3
        - name: tokenAddress
          in: query
          required: false
          description: |
            Optional token contract address whose third-party security scan (GoPlus token_security)
            is captured and signed as decision-input evidence. When set, the response carries a
            signed `contextAttestation` (Insight's capture statement, verifiable offline with a
            separately trusted key registry) and an advisory `tokenSecurity` view linked by both
            the source-response SHA-256 and a signed normalized-view SHA-256. This does not prove
            the source was correct, that an agent consumed the view, or that the decision was compliant.
            The response does not include the raw source body. When omitted, a built-in symbol map
            (Ethereum mainnet ETH/USDC/WBTC) is used. Advisory evidence only — these fields NEVER
            affect the verdict, are never part of the signed oracle attestation, and are omitted
            entirely (absent, not null) when the scan or signing fails (absence means "no evidence",
            not "safe").
          schema:
            type: string
            pattern: '^0x[0-9a-fA-F]{40}$'
            example: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        - name: decisionInputCheck
          in: query
          required: false
          description: Set to `1` to request the separate signed decision-input sufficiency assessment. It does not change the oracle safety verdict or authorize execution.
          schema: { type: string, enum: ['0', '1'] }
        - name: decisionPriceUsd
          in: query
          required: false
          description: Required with decisionInputCheck=1. Intended USD price for the operation.
          schema: { type: number, exclusiveMinimum: 0 }
        - name: quotePriceUsd
          in: query
          required: false
          description: Required with decisionInputCheck=1. Price returned by the actual venue quote.
          schema: { type: number, exclusiveMinimum: 0 }
        - name: quoteObservedAt
          in: query
          required: false
          description: Required with decisionInputCheck=1. Offset-qualified ISO-8601 venue quote timestamp.
          schema: { type: string, format: date-time }
        - name: maxReferenceDeviationBps
          in: query
          required: false
          description: Required with decisionInputCheck=1. Maximum decision-price deviation from each reference, in basis points.
          schema: { type: integer, minimum: 0, maximum: 10000 }
        - name: maxSlippageBps
          in: query
          required: false
          description: Required with decisionInputCheck=1. Maximum decision-price-to-venue-quote deviation, in basis points.
          schema: { type: integer, minimum: 0, maximum: 10000 }
        - name: maxQuoteAgeSeconds
          in: query
          required: false
          description: Required with decisionInputCheck=1. Maximum accepted age of the venue quote, 1 to 300 seconds.
          schema: { type: integer, minimum: 1, maximum: 300 }
        - name: quoteProvenance
          in: query
          required: false
          description: URL-encoded JSON hash-only quote-provenance envelope. Raw vendor request and response bytes stay with the caller. It binds source id, rights scope, asset, chain, price, timestamp, and request/response hashes.
          schema: { type: string, minLength: 2, maxLength: 4096 }
        - name: requireQuoteProvenance
          in: query
          required: false
          description: With decisionInputCheck=1, set to `1` to fail closed unless a permitted quoteProvenance envelope binds the submitted quote. A missing or prohibited envelope returns INSUFFICIENT_EVIDENCE.
          schema: { type: string, enum: ['0', '1'] }
        - name: reviewedUniswapV3AmountIn
          in: query
          required: false
          description: Exact source-token amount for the reviewed concentrated-liquidity pre-trade lane. Requires all reviewedUniswapV3 parameters, decisionInputCheck=1, and destinationAsset. Admitted routes are Monad MON/WMON→USDC, Base ETH/WETH→USDC, and Base PancakeSwap V3 USDC→USDT only.
          schema: { type: string, pattern: '^(?:0\.(?:0*[1-9][0-9]*)|[1-9][0-9]*(?:\.[0-9]+)?)$' }
        - name: reviewedUniswapV3MaxQuoteDeviationBps
          in: query
          required: false
          description: Maximum divergence between the pinned reviewed-pool quote and the submitted venue quote, in basis points.
          schema: { type: integer, minimum: 0, maximum: 10000 }
        - name: reviewedUniswapV3MaxTwapDeviationBps
          in: query
          required: false
          description: Maximum spot-to-TWAP divergence for the reviewed pool, in basis points.
          schema: { type: integer, minimum: 0, maximum: 10000 }
      responses:
        '200':
          description: Pre-trade safety verdict, paid through x402 or MPP or authorized by API key.
          headers:
            PAYMENT-RESPONSE:
              description: x402 settlement receipt when x402 was used.
              schema: { type: string }
            Payment-Receipt:
              description: MPP settlement receipt when MPP was used.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreTradeSafetyResponse'
        '402':
          description: >-
            HTTP 402 carries an x402 quote in PAYMENT-REQUIRED and, when MPP_ENABLED is active,
            an MPP evm charge challenge in WWW-Authenticate. API-key calls can also return 402
            when the credit balance is insufficient.
          headers:
            PAYMENT-REQUIRED:
              description: x402 v2 quote, base64 encoded.
              schema: { type: string }
            WWW-Authenticate:
              description: MPP challenge when enabled on this deployment.
              schema: { type: string }

  /safety/base-lending-guard:
    get:
      operationId: assessBaseLendingGuard
      tags: [Safety]
      summary: Base lending risk decision
      description: >-
        Read-only risk gate for a caller-declared post-action lending position on
        Base. It checks live reviewed protocol controls and oracle safety evidence;
        it never signs, submits, or authorizes a transaction. API-key access or
        x402 payment is accepted. Morpho Blue requires a marketId.
