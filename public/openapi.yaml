      parameters:
        - name: symbol
          in: query
          description: Wrapped asset symbol. Omit for all.
          schema:
            type: string
      responses:
        '200':
          description: Peg data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrappedPegResponse'
        '402':
          $ref: '#/components/responses/CreditExhausted'

  # ── Data ────────────────────────────────────────────────
  /coverage:
    get:
      operationId: getCoverage
      tags: [Data]
      summary: Oracle coverage analysis
      description: |
        Coverage analysis by chain, provider, and symbol. Identifies single-provider risk assets.

        **Credit-metered** — protocol-level intelligence, open to any paying key.
      security:
        - apiKey: []
      responses:
        '200':
          description: Coverage data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageResponse'
        '402':
          $ref: '#/components/responses/CreditExhausted'

  /coverage/policy:
    get:
      operationId: getCoveragePolicy
      tags: [Data]
      summary: Discover the versioned coverage readiness policy
      description: Returns policy bytes and their keccak256 canonical JSON content ID. Consumers must pin policy and signer trust independently. Does not activate a partner or execution gate. Uses coverage C2 metering.
      security:
        - apiKey: []
      parameters:
        - name: policyId
          in: query
          schema: { type: string }
          description: Optional exact policy ID; unknown IDs return 404.
      responses:
        '200':
          description: Standard success envelope containing policyId and policy
        '404':
          description: Unknown policy ID
        '402':
          $ref: '#/components/responses/CreditExhausted'

  /coverage/assessment:
    get:
      operationId: getCoverageAssessment
      tags: [Data]
      summary: Issue a live, scope-bound data-readiness report
      description: |
        Opt-in coverage v1. Checks classified providers, explicit evidence chain,
        oracle timestamp provenance, freshness, quorum, independent groups and spread.
        A PASS is not trade safety or execution permission. Separate Insight Coverage
        EIP-712 domain commits every observation and the policy ID. Consumers verify
        signature, policy, scope, key validity/revocation and current expiry locally.
        Missing signing configuration returns null signer/signature, which cannot
        authorize execution. Uses coverage C2 metering; Cache-Control is no-store.
      security:
        - apiKey: []
      parameters:
        - name: asset
          in: query
          required: true
          schema: { type: string, example: USDC }
        - name: chainId
          in: query
          required: true
          schema: { type: integer, minimum: 1, example: 1 }
        - name: policyId
          in: query
          required: true
          schema: { type: string, pattern: '^0x[0-9a-f]{64}$' }
      responses:
        '200':
          description: Coverage result; insufficient coverage is a signed result, not an HTTP error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [report, digest, signer, signature]
                    properties:
                      digest: { type: string, description: EIP-712 typed-data digest }
                      signer: { type: string, nullable: true }
                      signature: { type: string, nullable: true }
                      report:
                        type: object
                        required:
                          [
                            schema,
                            policyId,
                            asset,
                            evidenceChainId,
                            evaluatedAt,
                            validUntil,
                            observations,
                            evaluation,
                          ]
                        properties:
                          schema: { type: string, enum: [insight.coverage-report.v1] }
                          policyId: { type: string }
                          asset: { type: string }
                          evidenceChainId: { type: integer }
                          evaluatedAt: { type: integer, description: Unix seconds }
                          validUntil:
                            { type: integer, description: Exclusive Unix seconds deadline }
                          observations: { type: array, maxItems: 32, items: { type: object } }
                          evaluation:
                            type: object
                            properties:
                              status: { type: string, enum: [PASS, INSUFFICIENT_COVERAGE] }
                              eligibleProviders: { type: integer }
                              independentGroups: { type: integer }
                              spreadBps: { type: number, nullable: true }
                              reasons: { type: array, items: { type: string } }
                              providers: { type: array, items: { type: object } }
        '400':
          description: Invalid scope or unknown policy
        '402':
          $ref: '#/components/responses/CreditExhausted'
        '500':
          description: Registry, source service or signer unavailable; no authorization-grade proof

  /coverage/slo:
    get:
      operationId: getCoverageSlo
      tags: [Data]
      summary: Sampled data and signed-report readiness by asset, chain and policy
      description: Complete 15-minute slots from enrollment onward. Missing and failed samples remain in the denominator. Current partial slots are excluded. Empty history is WARMING_UP, never 100 percent. Internal objective, not a continuous-uptime SLA or execution verdict. Uses coverage C2 metering.
      security:
        - apiKey: []
      parameters:
        - name: hours
          in: query
          schema: { type: integer, enum: [24, 168, 672], default: 24 }
      responses:
        '200':
          description: Standard success envelope containing windowHours, cadenceSeconds, measuredAt and per-target counts, readiness rates, missing slots, error budget, burn rate and latest reasons
        '402':
          $ref: '#/components/responses/CreditExhausted'
        '500':
          description: Measurement store unavailable; must not be interpreted as healthy

  /hourly-snapshots:
    get:
      operationId: getHourlySnapshots
      tags: [Data]
      summary: Hourly price snapshots
      description: Query hourly price snapshots from the database for analysis and backtesting.
      security:
        - apiKey: []
      parameters:
        - name: symbol
          in: query
          schema:
            type: string
        - name: provider
          in: query
          schema:
            $ref: '#/components/schemas/OracleProvider'
        - $ref: '#/components/parameters/dateFrom'
        - $ref: '#/components/parameters/dateTo'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 2000
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Hourly snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HourlySnapshotsResponse'

  /price-snapshots:
    get:
      operationId: getPriceSnapshots
      tags: [Data]
      summary: 15-minute price snapshots 🔒
      description: |
        Fine-grained (15-minute) price snapshots for deep analysis, backtesting,
        and anomaly research. 4x denser than the hourly snapshots, populated by
        the GitHub Actions snapshot-collect workflow. 6-month rolling archive.

        **Credit-metered** — any API key with sufficient credit balance.
      security:
        - apiKey: []
      parameters:
        - name: symbol
          in: query
          schema:
            type: string
        - name: provider
          in: query
          schema:
            $ref: '#/components/schemas/OracleProvider'
        - name: chainId
          in: query
          schema:
            type: integer
            minimum: 0
        - $ref: '#/components/parameters/dateFrom'
        - $ref: '#/components/parameters/dateTo'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 2000
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 15-minute price snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceSnapshotsResponse'

  /price-records/export:
    get:
      operationId: exportPriceRecords
      tags: [Data]
      summary: Export price records 🔒
      description: |
        Export raw price records for external analysis. Supports filtering by symbol, provider, and date range.

        **Credit-metered** — any API key with sufficient credit balance.
      security:
        - apiKey: []
      parameters:
        - name: symbol
          in: query
          schema:
            type: string
        - name: provider
          in: query
          schema:
            $ref: '#/components/schemas/OracleProvider'
        - $ref: '#/components/parameters/dateFrom'
        - $ref: '#/components/parameters/dateTo'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50000
            default: 1000
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Price records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceExportResponse'
        '402':
          $ref: '#/components/responses/CreditExhausted'

  /reports/daily/{date}:
    get:
      operationId: getDailyReport
      tags: [Data]
      summary: Daily risk report
      description: Full daily oracle risk report including metrics, provider rankings, deviation events, coverage matrix, and recommendations.
      security:
        - apiKey: []
      parameters:
        - name: date
          in: path
          required: true
          description: Report date (YYYY-MM-DD)
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      responses:
        '200':
          description: Daily report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReportResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /health/ready:
    get:
      operationId: getHealthReadiness
      tags: [System]
      summary: Dependency readiness
      description: Checks database availability and freshness of the latest 15-minute price snapshot.
      security: []
      responses:
        '200':
          description: Dependencies are ready
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '503':
          description: Database unavailable or price data stale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorResponse' }

  /safety/preflight:
    get:
      operationId: executionPreflight
      tags: [Safety]
      summary: Chain-neutral execution preflight decision 🔒
      description: |
        Converts Insight's strict oracle assessment and an optional fresh venue quote into a
        data-sufficiency decision: `allow` / `caution` / `block`. A result evaluates only the
        declared data inputs; it never certifies contract code, custody, MEV outcome, execution,
        or profitability. On Monad (chain ID 143), the result surfaces Pyth Core evidence when
        available. `allow` requires both a passing oracle assessment and an eligible supplied
        venue quote; without decision-input evidence, a healthy oracle result remains `caution`.

        **Ways to pay:** use an API key with sufficient credits, or pay $0.02 USDC per successful
        check through x402. A payment settles only after the preflight returns successfully.
      security:
        - apiKey: []
        - {}
      parameters:
        - name: asset
          in: query
          required: true
          description: Asset symbol, e.g. MON, ETH, BTC.
          schema: { type: string, example: MON }
        - name: chainId
          in: query
          required: true
          description: Execution chain ID; Monad mainnet is 143.
          schema: { type: integer, example: 143 }
        - name: action
          in: query
          required: true
          description: Type of intended DeFi operation.
          schema: { type: string, enum: [swap, borrow, lend, liquidate, repay], example: swap }
        - name: tradeAmountUsd
          in: query
          required: true
          description: Intended operation size in USD.
          schema: { type: number, exclusiveMinimum: 0, example: 1000 }
        - name: targetProviders
          in: query
          required: false
          description: Optional comma-separated provider scope. On Monad, `pyth` reads the pinned Pyth Core fast path; one provider remains insufficient for an `allow` response.
          schema: { type: string, example: pyth }
        - name: destinationAsset
          in: query
          required: false
          description: Optional route destination asset, e.g. USDC.
          schema: { type: string, example: USDC }
        - name: decisionInputCheck
          in: query
          required: false
          description: Set to `1` to supply a venue quote and explicit limits. Required for an `allow` response.
          schema: { type: string, enum: ['0', '1'] }
        - name: decisionPriceUsd
          in: query
          required: false
          description: Required with decisionInputCheck=1. Intended USD decision price.
          schema: { type: number, exclusiveMinimum: 0 }
        - name: quotePriceUsd
          in: query
          required: false
          description: Required with decisionInputCheck=1. Fresh venue quote in USD.
          schema: { type: number, exclusiveMinimum: 0 }
        - name: quoteObservedAt
          in: query
          required: false
          description: Required with decisionInputCheck=1. Offset-qualified ISO-8601 quote time.
          schema: { type: string, format: date-time }
        - name: maxReferenceDeviationBps
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 10000 }
        - name: maxSlippageBps
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 10000 }
        - name: maxQuoteAgeSeconds
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 300 }
        - name: reviewedUniswapV3AmountIn
          in: query
          required: false
          description: Exact source-token amount for the reviewed Monad/Base concentrated-liquidity lane. Requires decisionInputCheck=1, destinationAsset, and both reviewedUniswapV3 bps limits. The Base USDC→USDT profile is PancakeSwap V3; all other admitted profiles are Uniswap V3.
          schema: { type: string, pattern: '^(?:0\.(?:0*[1-9][0-9]*)|[1-9][0-9]*(?:\.[0-9]+)?)$' }
        - name: reviewedUniswapV3MaxQuoteDeviationBps
          in: query
          required: false
          description: Maximum reviewed-pool quote divergence from the submitted venue quote, in basis points.
          schema: { type: integer, minimum: 0, maximum: 10000 }
        - name: reviewedUniswapV3MaxTwapDeviationBps
          in: query
          required: false
          description: Maximum reviewed-pool spot-to-TWAP divergence, in basis points.
          schema: { type: integer, minimum: 0, maximum: 10000 }
      responses:
        '200':
          description: Completed preflight decision with gates, reasons, and underlying strict assessment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [verdict, recommendation, gates, assessment]
                    properties:
                      verdict: { type: string, enum: [allow, caution, block] }
                      recommendation:
                        { type: string, enum: [proceed, review_before_execution, do_not_execute] }
                      gates: { type: object, additionalProperties: true }
                      assessment: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/CreditExhausted' }

  /safety/pre-trade/recheck:
    post:
      operationId: recheckPreTradeSafety
      tags: [Safety]
      summary: Re-check a previously attested trade
      description: Re-runs the safety check with fresh oracle state and binds the result to the original UID and request hash.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset, chainId, action, tradeAmountUsd, originalUid, originalRequestHash]
              properties:
                asset: { type: string }
                chainId: { type: integer }
                action: { type: string, enum: [swap, borrow, lend, liquidate, repay] }
                tradeAmountUsd: { type: number, exclusiveMinimum: 0 }
                originalUid: { type: string }
                originalRequestHash: { type: string, pattern: '^0x[0-9a-fA-F]{64}$' }
                originalConsensusPrice: { type: number, exclusiveMinimum: 0 }
                maxDriftPct: { type: number, exclusiveMinimum: 0 }
                schemaVersion: { type: integer, enum: [2, 3] }
      responses:
        '200': { description: Fresh bound re-check result }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/CreditExhausted' }

  /safety/attestation/verify:
    get:
      operationId: getSafetyAttestationVerificationSchema
      tags: [Safety]
      summary: Get safety attestation verification schemas
      security: []
      responses:
        '200': { description: Attester identity and supported EIP-712 schemas }
    post:
      operationId: verifySafetyAttestation
      tags: [Safety]
      summary: Verify a safety attestation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attestation]
              properties:
                attestation: { type: object, additionalProperties: true }
      responses:
        '200': { description: Cryptographic verification result }

  /safety/decision-input/evidence-pack:
    get:
      operationId: getDecisionEvidencePack
      tags: [Safety]
      summary: Assemble one operation's verifiable decision evidence pack
      description: Public assembly of one pre-trade operation's evidence chain (signed decision-input assessments, oracle pre-trade provenance, combined input-gate audit, signed execution receipt) into a manifest-hashed pack keyed by a 32-byte hex UID. The UID is the capability; the read is rate-limited and never cached. The pack is evidence for review and dispute, not authorization.
      security: []
      parameters:
        - name: preTradeUid
          in: query
          required: false
          schema: { type: string, pattern: '^0x[0-9a-fA-F]{64}$' }
          description: Anchor the pack on a pre-trade attestation UID
        - name: receiptUid
          in: query
          required: false
          schema: { type: string, pattern: '^0x[0-9a-fA-F]{64}$' }
          description: Anchor the pack on an execution receipt UID
      responses:
        '200':
          description: The assembled evidence pack, its computed manifest hashes, and a completeness summary of optional artifacts
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { description: Malformed or missing UID, or nothing anchored to it }
    post:
      operationId: verifyDecisionEvidencePack
      tags: [Safety]
      summary: Verify a decision evidence pack without persisting anything
      description: Recomputes the manifest hashes, verifies carried decision-input assessment signatures, client-held oracle envelopes, anchor linkage, and (when the full triangle is present) the closed-loop execution pair. Nothing is persisted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pack]
              properties:
                pack:
                  type: object
                  description: A decision evidence pack as returned by the GET endpoint, optionally merged with client-held artifacts
                  additionalProperties: true
              additionalProperties: false
      responses:
        '200':
          description: Integrity result with manifest validity, per-assessment checks, client-envelope checks, closed-loop status, and anchor linkage
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { description: Malformed verification request }

  /safety/decision-input/verify:
    get:
      operationId: getDecisionInputAttestationDescriptor
      tags: [Safety]
      summary: Get the decision-input attester and EIP-712 schema
      description: Public signer-readiness and verification descriptor. The status is READY, UNCONFIGURED, or UNTRUSTED_SIGNER.
      security: []
      responses:
        '200':
          description: Attester identity, readiness status, and frozen EIP-712 verification descriptor
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    post:
      operationId: verifyDecisionInputAssessment
      tags: [Safety]
      summary: Verify a signed decision-input assessment
      description: Recomputes the canonical assessment digest and verifies the frozen EIP-712 signature, trusted attester, UID, linked pre-trade UID, and expiry. A valid signature proves integrity and issuer identity; it does not prove quote-source authenticity or authorize a transaction.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assessment]
              properties:
                assessment:
                  type: object
                  description: Exact decisionInputAssessment object returned by the pre-trade endpoint, including its nested attestation
                  additionalProperties: true
              additionalProperties: false
      responses:
        '200':
          description: Cryptographic verification result, including validity, signer, digest, linked UID, expiry, and failure reason
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { description: Malformed verification request }

  /oracle-watch/attestation/verify:
    get:
      operationId: getOracleWatchAttestationVerificationSchema
      tags: [Oracle Watch]
      summary: Get Oracle Watch verification schema
      security: []
      responses:
        '200': { description: Attester identity and supported EIP-712 schemas }
    post:
      operationId: verifyOracleWatchAttestation
      tags: [Oracle Watch]
      summary: Verify an Oracle Watch attestation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attestation]
              properties:
                attestation: { type: object, additionalProperties: true }
      responses:
        '200': { description: Cryptographic verification result }

  /safety/envelope:
    get:
      operationId: verifySafetyEnvelope
      tags: [Safety]
      summary: Verify the two-receipt safety envelope
      description: Public prototype that combines price-integrity and market-state receipts and fails closed.
      security: []
      parameters:
        - name: demo
          in: query
          schema: { type: string, enum: [live, expired, tampered, tampered-market], default: live }
        - name: mic
          in: query
          schema: { type: string, pattern: '^[A-Z]{4}$', default: XCOI }
      responses:
        '200': { description: Envelope verdict and independently verifiable member receipts }
        '400': { description: Invalid demo mode or MIC }

# ══════════════════════════════════════════════════════════
components:
  # ── Security Schemes ────────────────────────────────────
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'API key with `ins_` prefix (e.g. ins_a3f1...)'
  # ── Reusable Parameters ─────────────────────────────────
  parameters:
    PartnerId:
      name: partnerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PartnerId'
    provider:
      name: provider
      in: query
      required: true
      description: Oracle provider name
      schema:
        $ref: '#/components/schemas/OracleProvider'
    symbol:
      name: symbol
      in: query
      required: true
      description: 'Asset symbol (e.g. BTC/USD, ETH/USD)'
      schema:
        type: string
        minLength: 1
        maxLength: 20
    chain:
      name: chain
      in: query
      description: Blockchain slug
      schema:
        $ref: '#/components/schemas/Blockchain'
    forceRefresh:
      name: forceRefresh
      in: query
      description: Bypass cache and fetch fresh data
      schema:
        type: boolean
    date:
      name: date
      in: query
      description: 'Date in YYYY-MM-DD format. Defaults to today UTC.'
      schema:
        type: string
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    dateFrom:
      name: from
      in: query
      description: 'Start date in YYYY-MM-DD format. Defaults to 7 days ago.'
      schema:
        type: string
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    dateTo:
      name: to
      in: query
      description: 'End date in YYYY-MM-DD format. Defaults to today.'
      schema:
        type: string
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    limit:
      name: limit
      in: query
      description: Maximum number of results
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    offset:
      name: offset
      in: query
      description: Number of results to skip
      schema:
        type: integer
        minimum: 0
        default: 0

  # ── Reusable Responses ──────────────────────────────────
  responses:
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: 'Missing or invalid X-API-Key header.'
              retryable: false

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            success: false
            error:
              code: SYMBOL_NOT_SUPPORTED
              message: 'No active oracle feed for the requested symbol.'
              retryable: false

    CreditExhausted:
      description: Wallet balance insufficient to cover the call's metering cost
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            success: false
            error:
              code: CREDIT_EXHAUSTED
              message: 'Insufficient credit balance. Top up at /api#pricing.'
              retryable: false

    InsufficientData:
      description: Not enough data points to compute the requested metric
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            success: false
            error:
              code: INSUFFICIENT_DATA
              message: 'Not enough data points to compute the requested metric.'
              retryable: false

    RateLimitExceeded:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            success: false
            error:
              code: RATE_LIMIT_EXCEEDED
              message: 'Too many requests. Retry after the timestamp in the response header.'
              retryable: true

  # ── Schemas ─────────────────────────────────────────────
  schemas:
    PartnerId:
      type: string
      enum:
        - agent-passport
        - andydgrea
        - emilia
        - frontier-compute
        - headless
        - interai
        - raul
        - vaara
        - veritas

    ImmutablePartnerPolicyId:
      type: string
      pattern: '^0x[0-9a-fA-F]{64}$'
      description: Content-addressed immutable partner admission policy selected by the current activation set.

    ExecutionReceipt:
      type: object
      required: [uid, schemaVersion, attester, signature, data]
      properties:
        uid:
          type: string
          pattern: '^0x[0-9a-fA-F]{64}$'
        schemaVersion:
          type: integer
          enum: [1, 2, 3, 4, 5]
        attester:
          type: string
          pattern: '^0x[0-9a-fA-F]{40}$'
        signature:
          type: string
        data:
          type: object
          additionalProperties: true
        eip712:
          type: object
          additionalProperties: true
      additionalProperties: true

    ExecutionIssueRequest:
      type: object
      required:
        - preTradeUid
        - requestHash
        - sourceAssetId
        - destinationAssetId
        - subjectChainId
        - settlementChainId
        - participantCount
        - sourceGroupCount
        - preTradeSignedAt
        - quotedPrice
        - txHash
      properties:
        preTradeUid: { type: string, pattern: '^0x[0-9a-fA-F]{64}$' }
        requestHash: { type: string, pattern: '^0x[0-9a-fA-F]{64}$' }
        sourceAssetId: { type: string }
        destinationAssetId: { type: string }
        subjectChainId: { type: integer, minimum: 1 }
        settlementChainId: { type: integer, minimum: 1 }
        participantCount: { type: integer, minimum: 0 }
        sourceGroupCount: { type: integer, minimum: 0 }
        preTradeSignedAt: { type: integer }
        quotedPrice: { type: number }
        maxSlippageBps:
          type: integer
          enum: [50]
          description: Current signed platform policy; custom post-settlement values are rejected.
        action: { type: string }
        txHash: { type: string, pattern: '^0x[0-9a-fA-F]{64}$' }
        taker: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        preTradeAttestations:
          type: object
          required: [source, destination]
          properties:
            source: { type: object, additionalProperties: true }
            destination: { type: object, additionalProperties: true }

