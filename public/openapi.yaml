        only from Loopscale's official API, resolves its address tables, checks
        the vault and principal mint, and simulates the exact message on Solana
        mainnet. An ALLOW never signs, submits, or authorizes a transaction.
        API-key access or x402 payment is accepted.
      security:
        - apiKey: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  wallet,
                  vault,
                  assetMint,
                  collateralSymbol,
                  loanSymbol,
                  collateralValueUsd,
                  principalAmount,
                ]
              properties:
                wallet: { type: string, description: Solana wallet public key. }
                vault: { type: string, description: Loopscale vault public key. }
                assetMint: { type: string, description: Vault principal SPL mint. }
                collateralSymbol: { type: string, example: USDC }
                loanSymbol: { type: string, example: USDC }
                collateralValueUsd: { type: number, exclusiveMinimum: 0, example: 1000 }
                principalAmount: { type: string, pattern: '^[1-9][0-9]*$', example: '1000000' }
                minLpAmount: { type: string, pattern: '^(?:0|[1-9][0-9]*)$', default: '0' }
      responses:
        '200':
          {
            description: Complete BLOCK,
            CAUTION,
            or ALLOW decision with an exact unsigned message when accepted.,
          }
