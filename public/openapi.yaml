          $ref: '#/components/schemas/ApiMeta'

    PreTradeSafetyResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            verdict:
              type: string
              enum: [PASS, CAUTION, DANGER, BLOCK]
              description: |
                Overall safety verdict. Agents MUST NOT execute trades when `DANGER` or `BLOCK`.
            consensusPrice:
              type: number
              description: Cross-oracle consensus price for the asset.
            maxDeviationPct:
              type: number
              description: Largest per-provider deviation from consensus (percentage).
            manipulationRiskScore:
              type: number
              minimum: 0
              maximum: 1
              description: Weighted manipulation risk score (0=low, 1=high).
            staleDataRisk:
              type: boolean
              description: True if any oracle data exceeds the staleness caution threshold.
            crossProviderAgreement:
              type: number
              minimum: 0
              maximum: 1
              description: Agreement score across providers (1=perfect agreement).
            recommendedMaxPositionUsd:
              type: number
              description: Suggested maximum position size in USD given current risk.
            participantCount:
              type: integer
              description: Number of oracle providers that contributed a price.
            providerPrices:
              type: object
              additionalProperties:
                type: object
                properties:
                  price:
                    type: number
                  deviationPct:
                    type: number
                    nullable: true
                  isOutlier:
                    type: boolean
                  dataAgeSeconds:
                    type: integer
                    nullable: true
                  isStale:
                    type: boolean
                  confidence:
                    type: number
                    nullable: true
                  reputationScore:
                    type: number
                    nullable: true
                  status:
                    type: string
                    enum: [success, unsupported, error]
            depegWarnings:
              type: array
              items:
                type: object
                properties:
                  stablecoin:
                    type: string
                  deviationPct:
                    type: number
                  riskLevel:
                    type: string
            warnings:
              type: array
              items:
                type: string
            contributingFactors:
              type: array
              items:
                type: object
                properties:
                  rule:
                    type: string
                  value:
                    type: number
                  threshold:
                    type: number
                  triggeredVerdict:
                    type: string
                    enum: [CAUTION, DANGER, BLOCK]
                  message:
                    type: string
            evaluatedAt:
              type: string
              format: date-time
            latencyMs:
              type: integer
            contextAttestation:
              type: object
              description: Independent EIP-712 capture statement. V2 binds the normalized tokenSecurity view; V1 verifies cryptographically but does not bind the returned view.
              required: [schemaVersion, capturedAt, entries]
              properties:
                schemaVersion:
                  type: integer
                  enum: [1, 2]
                capturedAt:
                  type: string
                  format: date-time
                entries:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [kind, source, request, rawResponseSha256, retrievedAt, priorSeal]
                    properties:
                      kind: { type: string, example: third_party_token_scan }
                      source: { type: string, example: gopluslabs }
                      request:
                        type: object
                        required: [chainId, contractAddress]
                        properties:
                          chainId: { type: integer, minimum: 1 }
                          contractAddress: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
                      rawResponseSha256: { type: string, pattern: '^0x[0-9a-f]{64}$' }
                      normalizedResultSha256:
                        type: string
                        pattern: '^0x[0-9a-f]{64}$'
                        description: Required by schemaVersion 2; SHA-256 over canonical normalized tokenSecurity JSON.
                      retrievedAt: { type: string, format: date-time }
                      toolVersion: { type: string }
                      authorization: { type: string }
                      latencyMs: { type: integer, minimum: 0 }
                      transactionContext: { type: string }
                      priorSeal:
                        type: object
                        required: [manifest, signature, keyId]
                        properties:
                          manifest:
                            { type: string, enum: [context-attestation.v1, context-attestation.v2] }
                          signature: { type: string, pattern: '^0x[0-9a-fA-F]{130}$' }
                          keyId: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
            tokenSecurity:
              type: object
              description: Advisory normalized third-party scan view. SchemaVersion 2 contextAttestation binds this exact view digest; it remains non-authorizing and source truth is not independently established.
              required: [schema, sourcedFrom, rawHash, advisory]
              properties:
                schema: { type: string, const: insight.token-security-view.v1 }
                sourcedFrom: { type: string, example: gopluslabs }
                rawHash: { type: string, pattern: '^0x[0-9a-f]{64}$' }
                advisory: { type: boolean, const: true }
                isHoneypot: { type: boolean }
                buyTaxPct: { type: number, minimum: 0, maximum: 100 }
                sellTaxPct: { type: number, minimum: 0, maximum: 100 }
                isOpenSource: { type: boolean }
                isProxy: { type: boolean }
                isMintable: { type: boolean }
                hiddenOwner: { type: boolean }
                holderCount: { type: integer, minimum: 0 }
                isInCex: { type: boolean }
                trustList: { type: boolean }
                tokenSymbol: { type: string, maxLength: 128 }
        meta:
          $ref: '#/components/schemas/ApiMeta'

    OracleWatchResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            symbol:
              type: string
              description: Asset symbol.
            chain:
              type: string
              nullable: true
              description: Blockchain the signal was scoped to, if any.
            verdict:
              type: string
              enum: [normal, caution, danger]
              description: |
                Always-on trust verdict. `danger` means pause dependent operations; it also
                covers assets with no cross-oracle coverage.
            recommendation:
              type: string
              enum: [proceed, proceed_with_caution, halt]
              description: Actionable recommendation for an agent.
            maxDeviationPct:
              type: number
              nullable: true
              description: Max |deviation from consensus| across responding providers.
            agreement:
              type: number
              minimum: 0
              maximum: 1
              description: Cross-provider agreement (1 = perfect agreement).
            participantCount:
              type: integer
              description: Number of providers that contributed a price.
            outlierCount:
              type: integer
              description: Number of responding providers flagged as outliers.
            staleCount:
              type: integer
              description: Number of responding providers whose data is stale.
            consensusPrice:
              type: number
              nullable: true
              description: Cross-oracle consensus price for the asset.
            reason:
              type: string
              description: Machine-readable reason for the verdict.
            quorumSatisfied:
              type: boolean
              description: True when at least 3 independent providers are responding.
            trustScore:
              type: number
              minimum: 0
              maximum: 100
              description: Composite 0-100 credibility rating an agent can gate on.
            trustLevel:
              type: string
              enum: [low, medium, high]
              description: Discrete credibility gate derived from trustScore.
            providers:
              type: array
              items:
                type: object
                properties:
                  provider:
                    type: string
                  status:
                    type: string
                    enum: [success, unsupported, error]
                  deviationPct:
                    type: number
                    nullable: true
                  isOutlier:
                    type: boolean
                  isStale:
                    type: boolean
            evaluatedAt:
              type: string
              format: date-time
        meta:
          $ref: '#/components/schemas/ApiMeta'

    OracleWatchHistoryPoint:
