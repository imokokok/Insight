    post:
      operationId: createAlert
      tags: [Alerts]
      summary: Create price alert
      description: Create a new price alert. Requires session auth (Bearer token), not API key.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRequest'
      responses:
        '201':
