      security: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
            pattern: '^0x[0-9a-fA-F]{64}$'
      responses:
        '200':
          description: Complete persisted signed envelope
        '404':
          $ref: '#/components/responses/NotFound'

