  # ── Alerts ──────────────────────────────────────────────
  /alerts:
    get:
      operationId: listAlerts
      tags: [Alerts]
      summary: List price alerts
      description: List the authenticated user's price alerts. Requires session auth (Bearer token), not API key.
      security:
