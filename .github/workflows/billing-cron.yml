name: Billing Cron

# Daily billing pipeline: downgrade expired trials/subscriptions, clean up
# zombie incomplete subscription rows, and (on the 1st of the month) reset
# monthly API-key quota counters.
#
# Runs the `scripts/billing.ts` runner directly on GH Actions (no Vercel
# curl) so the job escapes Vercel's 60s serverless timeout — billing touches
# every API key row and previously risked truncation during cold-start DB
# connection latency. Delegates to the same `runBilling()` used by the HTTP
# route, so behaviour is identical — only the executor changes.

on:
  schedule:
    # Daily at 00:30 UTC (08:30 CST)
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  CRON_WORKFLOW: billing-cron.yml

jobs:
  billing-cron:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Start run ledger
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/cron-control.mjs start

      - name: Run billing cron
        run: |
          for attempt in 1 2 3; do
            if node .github/cron-dist/billing.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "[billing] attempt ${attempt}/3 failed; retrying in $((attempt * 60))s"
              sleep "$((attempt * 60))"
            fi
          done
          echo "::error::Billing failed after three attempts"
          exit 1

      - name: Finish run ledger
        if: always()
        env:
          CRON_CONCLUSION: ${{ job.status }}
        run: node scripts/cron-control.mjs finish
