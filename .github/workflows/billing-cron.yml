name: Billing Cron

# Daily billing pipeline: downgrade expired trials/subscriptions, clean up
# zombie incomplete subscription rows, and (on the 1st of the month) reset
# monthly API-key quota counters.
#
# Runs the `scripts/billing.ts` runner directly on GH Actions (no Vercel
# curl) so the job escapes Vercel's 60s serverless timeout — billing touches
# every API key row and previously risked truncation during cold-start DB
# connection latency. Delegates to the same `runBilling()` used by the HTTP
# route, so behaviour is identical — only the executor changes.

on:
  schedule:
    # Daily at 00:30 UTC (08:30 CST)
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  billing-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Run billing cron
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/billing.ts
