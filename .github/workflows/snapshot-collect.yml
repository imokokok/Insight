name: Snapshot Collect

# High-frequency oracle price-snapshot collection, running the fetch pipeline
# DIRECTLY on the GitHub runner (not via a curl to a Vercel function). This
# escapes Vercel's 60s serverless timeout — a single collection pass takes
# ~60-90s, which would be killed on Vercel.
#
# Dual-writes:
#   - hourly_price_snapshots (upsert) — drives the daily report, same as before
#   - price_snapshots (append, 15-min grain) — ML / anomaly detection, 4x
#     denser signal than the previous hourly-only cadence
#
# Public repo → unlimited Actions minutes. 120 days of 15-min data is retained
# by the price-snapshots-cleanup pg_cron job (migration 0043). This run also
# keeps Supabase active (free tier pauses after 1 week of inactivity), which is
# why the former weekly keep-alive ping in feed-discovery.yml was removed.

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Supabase fallback dispatch ledger ID
        required: false
        type: string
      scheduled_for:
        description: UTC dispatch timestamp; required to resolve the 15-minute slot
        required: true
        type: string

# Prevent overlapping 15-min runs. If a run exceeds 15 min (extremely
# unlikely — typical runtime is ~50s), queue the new run instead of
# cancelling the stale one. Previously used cancel-in-progress: true,
# which caused a cascading failure: when GitHub's runner fleet was
# temporarily unavailable, every new run (every 15 min) cancelled the
# still-queued previous run, so no run ever acquired a runner. With
# cancel-in-progress: false, queued runs accumulate and execute in order
# once a runner becomes available, giving the infrastructure time to
# recover.
#
# The upsert on hourly_price_snapshots is idempotent and each
# price_snapshots row is independent, so overlapping runs are data-safe.
concurrency:
  group: snapshot-collect
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  # Keep the collector on the proven Supabase path until the migration runbook
  # explicitly advances it to shadow, then primary. An unset token is harmless
  # in legacy mode; the code fails closed before either non-legacy mode writes.
  TURSO_PRICE_DATABASE_URL: libsql://insight-imokokok.aws-ap-southeast-1.turso.io
  TURSO_PRICE_AUTH_TOKEN: ${{ secrets.TURSO_PRICE_AUTH_TOKEN }}
  TURSO_PRICE_PARTITION_KEY: ${{ vars.TURSO_PRICE_PARTITION_KEY || 'bootstrap' }}
  TURSO_PRICE_WRITE_MODE: ${{ vars.TURSO_PRICE_WRITE_MODE || 'legacy' }}
  # Market-reference egress retirement (2026-11): ops client reuses the price
  # database credentials above; mode advances via the TURSO_MARKET_REF_MODE var.
  TURSO_MARKET_REF_MODE: ${{ vars.TURSO_MARKET_REF_MODE || 'supabase' }}
  TURSO_PRICE_READ_CUTOVER_AT: ${{ vars.TURSO_PRICE_READ_CUTOVER_AT || '' }}
  SNAPSHOT_TRIGGER_SOURCE: github_actions
  CRON_WORKFLOW: snapshot-collect.yml
  CRON_DISPATCH_ID: ${{ inputs.dispatch_id || '' }}
  CRON_SCHEDULED_FOR: ${{ inputs.scheduled_for || '' }}
  # Alchemy RPC keys (optional — public RPC fallbacks exist, but Alchemy
  # is more reliable for on-chain oracle reads). Same keys as .env.local.
  ALCHEMY_ETHEREUM_RPC: ${{ secrets.ALCHEMY_ETHEREUM_RPC }}
  ALCHEMY_ARBITRUM_RPC: ${{ secrets.ALCHEMY_ARBITRUM_RPC }}
  ALCHEMY_OPTIMISM_RPC: ${{ secrets.ALCHEMY_OPTIMISM_RPC }}
  ALCHEMY_POLYGON_RPC: ${{ secrets.ALCHEMY_POLYGON_RPC }}
  ALCHEMY_BASE_RPC: ${{ secrets.ALCHEMY_BASE_RPC }}
  ALCHEMY_BNB_RPC: ${{ secrets.ALCHEMY_BNB_RPC }}
  ALCHEMY_AVALANCHE_RPC: ${{ secrets.ALCHEMY_AVALANCHE_RPC }}
  ALCHEMY_ZKSYNC_RPC: ${{ secrets.ALCHEMY_ZKSYNC_RPC }}
  ALCHEMY_SCROLL_RPC: ${{ secrets.ALCHEMY_SCROLL_RPC }}
  ALCHEMY_MANTLE_RPC: ${{ secrets.ALCHEMY_MANTLE_RPC }}
  ALCHEMY_LINEA_RPC: ${{ secrets.ALCHEMY_LINEA_RPC }}
  ALCHEMY_MONAD_RPC: ${{ secrets.ALCHEMY_MONAD_RPC }}
  ALCHEMY_SOLANA_RPC: ${{ secrets.ALCHEMY_SOLANA_RPC }}
  TRON_RPC_URL: ${{ secrets.TRON_RPC_URL }}
  TRON_SOLIDITY_RPC: ${{ secrets.TRON_SOLIDITY_RPC }}
  TRON_FULLNODE_RPC: ${{ secrets.TRON_FULLNODE_RPC }}
  TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify required secrets
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets are required (same secrets already used by ml-train-cron). Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Require scheduler-provided slot
        run: |
          if [ -z "${CRON_SCHEDULED_FOR}" ]; then
            echo "::error title=Missing scheduled_for::CRON_SCHEDULED_FOR is required to resolve the 15-minute slot; the runner clock is not a fallback."
            exit 1
          fi

      - name: Collect snapshots
        run: node .github/cron-dist/collect-snapshot.mjs

      # Supabase owns the high-frequency clock and creates the dispatch row.
      # A direct manual run has no ID and deliberately adds no telemetry row.
      - name: Finish fallback dispatch ledger
        if: always() && env.CRON_DISPATCH_ID != ''
        env:
          CRON_CONCLUSION: ${{ job.status }}
        run: node scripts/cron-control.mjs finish

  # Evidence collection has a separate job result from raw capture. A transient
  # Supabase schema-cache or evidence-source issue remains visible in Actions,
  # but can never turn a captured Turso slot into a failed collection run.
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Settlement-evidence signing is optional: without the key, packs are
      # persisted unsigned and the collection run still succeeds.
      ATTESTATION_SIGNER_PRIVATE_KEY: ${{ secrets.ATTESTATION_SIGNER_PRIVATE_KEY }}
      POLYMARKET_GAMMA_BASE_URL: ${{ vars.POLYMARKET_GAMMA_BASE_URL || '' }}
      # Optional webhook (Slack-compatible `{ text }`) pinged when a graded
      # window resolves against Insight's independent verdict. Delivery is
      # best-effort and never fails the collection run.
      SETTLEMENT_ALERT_WEBHOOK_URL: ${{ secrets.SETTLEMENT_ALERT_WEBHOOK_URL || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify required secrets
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are required."
            exit 1
          fi

      # External truth layer. The checked-in source-rights gate makes this a
      # no-op until a reviewed vendor agreement is recorded; it cannot be
      # enabled by a repository variable alone.
      - name: Collect market reference
        run: node .github/cron-dist/collect-market-reference.mjs

      # Manipulation-cost layer (foundation block ②: DEX pool depth -> cost to
      # move price). Evidence failure is isolated to this job and does not
      # affect the raw capture lease or its projection acknowledgement.
      - name: Collect manipulation cost
        run: node .github/cron-dist/collect-manip-cost.mjs

      # Prediction-market settlement evidence (Gamma watch → Kraken candles →
      # signed packs). Kraken is the only rights-cleared collection venue; the
      # library fails closed and every step above tolerates an upstream outage.
      #
      # Hourly gate: the series this collector covers currently yields zero
      # output, so 3 of 4 dispatches per hour are pure Supabase IO. Run it only
      # on the top-of-hour slot. The slot must come from the dispatch ledger;
      # without it the gate fails loudly instead of using the runner clock.
      - name: Settlement hourly gate
        id: settlement_gate
        run: |
          minute=""
          slot="${{ inputs.scheduled_for }}"
          if [ -n "$slot" ]; then
            minute=$(date -u -d "$slot" +%M 2>/dev/null || echo "")
          fi
          if [ -z "$minute" ]; then
            echo "::error title=Missing scheduled_for::Cannot resolve the settlement slot without CRON_SCHEDULED_FOR."
            exit 1
          fi
          if [ "$((10#$minute))" -lt 15 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "settlement slot: top-of-hour (minute=$minute), running"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "settlement slot: non-top-of-hour (minute=$minute), skipping"
          fi

      - name: Collect settlement evidence
        if: steps.settlement_gate.outputs.run == 'true'
        run: node .github/cron-dist/collect-settlement-evidence.mjs
