name: Snapshot Collect

# High-frequency oracle price-snapshot collection, running the fetch pipeline
# DIRECTLY on the GitHub runner (not via a curl to a Vercel function). This
# escapes Vercel's 60s serverless timeout — a single collection pass takes
# ~60-90s, which would be killed on Vercel.
#
# Dual-writes:
#   - hourly_price_snapshots (upsert) — drives the daily report, same as before
#   - price_snapshots (append, 15-min grain) — ML / anomaly detection, 4x
#     denser signal than the previous hourly-only cadence
#
# Public repo → unlimited Actions minutes. 6 months of 15-min data is retained
# by the price-snapshots-cleanup pg_cron job (migration 0023). This run also
# keeps Supabase active (free tier pauses after 1 week of inactivity), which is
# why the former weekly keep-alive ping in feed-discovery.yml was removed.

on:
  schedule:
    # Every 15 minutes at :00,:15,:30,:45
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Prevent overlapping 15-min runs. If a run exceeds 15 min (extremely
# unlikely — typical runtime is ~50s), cancel the stale run and start
# fresh. The upsert on hourly_price_snapshots is idempotent and each
# price_snapshots row is independent, so cancellation is data-safe.
concurrency:
  group: snapshot-collect
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  # Alchemy RPC keys (optional — public RPC fallbacks exist, but Alchemy
  # is more reliable for on-chain oracle reads). Same keys as .env.local.
  ALCHEMY_ETHEREUM_RPC: ${{ secrets.ALCHEMY_ETHEREUM_RPC }}
  ALCHEMY_ARBITRUM_RPC: ${{ secrets.ALCHEMY_ARBITRUM_RPC }}
  ALCHEMY_OPTIMISM_RPC: ${{ secrets.ALCHEMY_OPTIMISM_RPC }}
  ALCHEMY_POLYGON_RPC: ${{ secrets.ALCHEMY_POLYGON_RPC }}
  ALCHEMY_BASE_RPC: ${{ secrets.ALCHEMY_BASE_RPC }}
  ALCHEMY_BNB_RPC: ${{ secrets.ALCHEMY_BNB_RPC }}
  ALCHEMY_AVALANCHE_RPC: ${{ secrets.ALCHEMY_AVALANCHE_RPC }}
  ALCHEMY_ZKSYNC_RPC: ${{ secrets.ALCHEMY_ZKSYNC_RPC }}
  ALCHEMY_SCROLL_RPC: ${{ secrets.ALCHEMY_SCROLL_RPC }}
  ALCHEMY_MANTLE_RPC: ${{ secrets.ALCHEMY_MANTLE_RPC }}
  ALCHEMY_LINEA_RPC: ${{ secrets.ALCHEMY_LINEA_RPC }}
  ALCHEMY_SOLANA_RPC: ${{ secrets.ALCHEMY_SOLANA_RPC }}
  TRON_RPC_URL: ${{ secrets.TRON_RPC_URL }}
  TRON_SOLIDITY_RPC: ${{ secrets.TRON_SOLIDITY_RPC }}
  TRON_FULLNODE_RPC: ${{ secrets.TRON_FULLNODE_RPC }}
  TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets are required (same secrets already used by ml-train-cron). Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Collect snapshots
        run: npx tsx scripts/collect-snapshot.ts
