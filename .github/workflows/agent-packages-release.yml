name: Agent packages release

on:
  push:
    tags: ['agent-packages-v*']

concurrency:
  group: agent-packages-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish agent packages with provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
      # Trusted Publishing (OIDC, no NODE_AUTH_TOKEN) and --provenance both
      # require npm >= 11.5.1. The runner's bundled npm is older.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@^11
          npm --version
      # Provenance binds to repository.url. Both packages must point at this
      # repository, and npm package settings must list this exact workflow
      # filename as a trusted publisher with direct `npm publish` allowed.
      - name: Verify release metadata
        run: |
          set -euo pipefail
          for dir in mcp-launcher integrations/elizaos-plugin-insight; do
            node -e '
              const p = require(`./${process.argv[1]}/package.json`);
              const url = p.repository && p.repository.url;
              if (url !== "git+https://github.com/imokokok/Insight.git") {
                console.error(`${process.argv[1]}: repository.url is ${url}`);
                process.exit(1);
              }
              console.log(`${p.name}@${p.version} -> ${url}`);
            ' "$dir"
          done
      - name: Install and build the ElizaOS plugin
        run: |
          cd integrations/elizaos-plugin-insight
          npm ci
          npm run build
      - name: Run the launcher tests
        run: node --test mcp-launcher/test/*.test.mjs
      # NOTE: run publish from inside each package directory. `npm --prefix
      # <dir> publish` resolves against the repository root under npm 11 and
      # breaks the OIDC context (observed live on the PriorSeal sdk-v0.9.2
      # run: wrong package packed, ENEEDAUTH).
      # Idempotent by design: if the exact version is already live, skip it
      # instead of failing the whole release. A version still sitting in npm's
      # staging area occupies the same semver index; approve or reject the
      # staged entry before tagging a release for that version.
      - name: Publish oracle-insight-mcp
        run: |
          set -euo pipefail
          cd mcp-launcher
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping publish"
          else
            npm publish --provenance --access public
          fi
      - name: Publish elizaos-plugin-oracle-insight
        run: |
          set -euo pipefail
          cd integrations/elizaos-plugin-insight
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping publish"
          else
            npm publish --provenance --access public
          fi
