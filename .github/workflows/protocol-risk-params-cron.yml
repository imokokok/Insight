name: Protocol Risk Params Sync

# Syncs per-asset risk parameters (liquidation threshold, max LTV, collateral
# factor, exchange rate) from each lending protocol into the
# protocol_asset_risk_params table.
#
# Runs the `scripts/protocol-metrics.ts` runner directly on GH Actions (no
# Vercel curl) so the job escapes Vercel's 60s serverless timeout — risk-params
# mode scrapes per-asset parameters from every lending protocol and can exceed
# the ceiling. Delegates to the same `runProtocolMetrics()` used by the HTTP
# route, so behaviour is identical — only the executor changes.

on:
  schedule:
    # Every 6 hours at minute 30 (offset from TVL sync)
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-risk-params:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Run protocol risk params sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node .github/cron-dist/protocol-metrics.mjs --mode=risk-params
