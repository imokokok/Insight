name: Feed Reactivation

# Re-probe deactivated oracle feeds and revive any that have recovered
# upstream. Feeds are auto-deactivated after 3 consecutive failures, but
# upstream outages are often transient — without this pass a recovered feed
# stays is_active=false until the next weekly discovery, silently dropping
# coverage from the daily report. Runs every 12h so recovery latency is hours
# not days.
#
# Runs the `scripts/sync-feeds.ts` runner directly on GH Actions (no Vercel
# curl) so the job is bound only by the probe budget (≤200 feeds × 6s), not by
# Vercel's 60s serverless timeout. Delegates to the same `runFeedSync()` used
# by the HTTP route, so behaviour is identical — only the executor changes.

on:
  schedule:
    # Every 12 hours at minute 15 (offset from the snapshot collector so
    # reactivation completes before the next 15-min snapshot).
    - cron: '15 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reactivate-feeds:
    runs-on: ubuntu-latest
    # Raised 5 → 15 min: REACTIVATE_LIMIT is now 200 (was 40), so a large batch
    # of feeds deactivated by a transient incident recovers in a single 12h
    # pass. 200 × 6s worst case ≈ 20 min, but probes run with concurrency and
    # most skip fast, so 15 min is a safe ceiling with headroom.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run feed reactivation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Alchemy RPC keys (optional — public RPC fallbacks exist).
          ALCHEMY_ETHEREUM_RPC: ${{ secrets.ALCHEMY_ETHEREUM_RPC }}
          ALCHEMY_ARBITRUM_RPC: ${{ secrets.ALCHEMY_ARBITRUM_RPC }}
          ALCHEMY_OPTIMISM_RPC: ${{ secrets.ALCHEMY_OPTIMISM_RPC }}
          ALCHEMY_POLYGON_RPC: ${{ secrets.ALCHEMY_POLYGON_RPC }}
          ALCHEMY_BASE_RPC: ${{ secrets.ALCHEMY_BASE_RPC }}
          ALCHEMY_BNB_RPC: ${{ secrets.ALCHEMY_BNB_RPC }}
          ALCHEMY_AVALANCHE_RPC: ${{ secrets.ALCHEMY_AVALANCHE_RPC }}
          ALCHEMY_ZKSYNC_RPC: ${{ secrets.ALCHEMY_ZKSYNC_RPC }}
          ALCHEMY_SCROLL_RPC: ${{ secrets.ALCHEMY_SCROLL_RPC }}
          ALCHEMY_MANTLE_RPC: ${{ secrets.ALCHEMY_MANTLE_RPC }}
          ALCHEMY_LINEA_RPC: ${{ secrets.ALCHEMY_LINEA_RPC }}
          ALCHEMY_SOLANA_RPC: ${{ secrets.ALCHEMY_SOLANA_RPC }}
          TRON_RPC_URL: ${{ secrets.TRON_RPC_URL }}
          TRON_SOLIDITY_RPC: ${{ secrets.TRON_SOLIDITY_RPC }}
          TRON_FULLNODE_RPC: ${{ secrets.TRON_FULLNODE_RPC }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
        run: node .github/cron-dist/sync-feeds.mjs --mode=reactivate
