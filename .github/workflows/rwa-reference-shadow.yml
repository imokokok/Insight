name: RWA Reference Shadow Check

on:
  schedule:
    # GitHub cron is UTC. These are 10:00 Asia/Shanghai on the MIC effective
    # date, the one-week midpoint and the two-week close. The date guard below
    # prevents these annual cron expressions from running after the 2026 pilot.
    - cron: '0 2 28 9 *'
    - cron: '0 2 5,12 10 *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: rwa-reference-shadow
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check pilot date
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          local_date="$(TZ=Asia/Shanghai date +%F)"
          should_run=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            should_run=true
          elif [ "$local_date" = 2026-09-28 ] || [ "$local_date" = 2026-10-05 ] || [ "$local_date" = 2026-10-12 ]; then
            should_run=true
          fi
          echo "local_date=$local_date" >> "$GITHUB_OUTPUT"
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install pinned dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: npm ci

      - name: Restore prior hash-chain state
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .local/rwa-shadow-pilot
          key: rwa-shadow-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rwa-shadow-${{ runner.os }}-

      - name: Recover the newest pilot evidence from cache or workflow artifact
        if: steps.gate.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_DATE: ${{ steps.gate.outputs.local_date }}
        run: |
          mkdir -p .local/rwa-shadow-pilot
          cached_events=".local/rwa-shadow-pilot/events.ndjson"
          cached_count="$(test -f "$cached_events" && wc -l < "$cached_events" || echo 0)"
          for run_id in $(gh run list --workflow rwa-reference-shadow.yml --branch main --limit 100 --json databaseId --jq '.[].databaseId'); do
            restore_dir="$RUNNER_TEMP/rwa-shadow-restore-$run_id"
            if gh run download "$run_id" --pattern 'rwa-shadow-*' --dir "$restore_dir" >/dev/null 2>&1; then
              events_file="$(find "$restore_dir" -type f -name events.ndjson -print -quit)"
              if [ -n "$events_file" ]; then
                artifact_count="$(wc -l < "$events_file")"
                if [ "$artifact_count" -gt "$cached_count" ]; then
                  cp -a "$(dirname "$events_file")/." .local/rwa-shadow-pilot/
                  echo "Recovered RWA pilot evidence from run $run_id"
                fi
                break
              fi
            fi
          done
          if [[ "$LOCAL_DATE" > 2026-09-28 ]] && [ ! -s "$cached_events" ]; then
            echo '::error::Prior RWA pilot evidence is missing; refusing to start a new hash chain'
            exit 1
          fi
          npm run rwa:pilot:status

      - name: Sample ISO MIC, OpenFIGI and Robinhood
        id: sample
        if: steps.gate.outputs.should_run == 'true'
        env:
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: npm run rwa:pilot:sample

      - name: Save updated hash-chain state
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .local/rwa-shadow-pilot
          key: rwa-shadow-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload auditable pilot evidence
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rwa-shadow-${{ steps.gate.outputs.local_date }}-${{ github.run_attempt }}
          path: .local/rwa-shadow-pilot
          if-no-files-found: error
          retention-days: 90

      - name: Publish summary
        if: always() && steps.gate.outputs.should_run == 'true'
        run: |
          if [ -f .local/rwa-shadow-pilot/summary.json ]; then
            echo '## RWA reference shadow pilot' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            node -e 'const s=require("./.local/rwa-shadow-pilot/summary.json"); console.log(JSON.stringify(s,null,2))' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
