name: ML Model Retrain

on:
  schedule:
    # Every 3 days at 07:00 UTC (days 1, 4, 7, ... 28, 31). GitHub Actions cron
    # does not support a true "every 3 days" step across month boundaries; this
    # is close enough and stays off the top/bottom of the hour to avoid the
    # GitHub cron load peak.
    - cron: '0 7 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Verify required secrets
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets are required. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Test training data semantics
        run: python -m unittest discover -s ml -p 'test_*.py'

      - name: Train model
        run: python ml/train.py

      - name: Inspect model output
        id: inspect
        run: |
          set -u
          MODEL="ml/models/oracle_risk_model.json"
          if [ ! -f "$MODEL" ]; then
            echo "::error::Trainer produced no model file."
            exit 1
          fi
          # Print metrics for the run log so each scheduled run is reviewable.
          python - <<'PY'
          import json
          m = json.load(open("ml/models/oracle_risk_model.json"))
          print(f"active={m.get('active')} trainedAt={m.get('trainedAt')}")
          print(f"trees={len(m.get('trees', []))}")
          print("metrics=" + json.dumps(m.get("metrics", {}), indent=2))
          if not m.get("active"):
              print(f"inactiveReason={m.get('inactiveReason')}")
          PY

      - name: Regression gate (discrimination and calibration)
        run: python -m ml.regression_gate

      # Oracle Watch's dependency-free runner contains the statically imported
      # model. Rebuild it only when training changed the model so scheduled
      # inference never lags behind the deployed application model.
      - name: Check whether model changed
        id: model-diff
        run: |
          if git diff --quiet -- ml/models/oracle_risk_model.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node for cron bundle refresh
        if: steps.model-diff.outputs.changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install bundler dependencies
        if: steps.model-diff.outputs.changed == 'true'
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Refresh dependency-free cron bundles
        if: steps.model-diff.outputs.changed == 'true'
        run: npm run build:cron

      - name: Commit model if changed; Quality Gate owns redeployment
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- ml/models/oracle_risk_model.json .github/cron-dist; then
            echo "Model unchanged; nothing to commit."
            exit 0
          fi
          git add ml/models/oracle_risk_model.json .github/cron-dist
          git commit -m "chore(ml): retrain oracle risk model" || true
          git push

          # Do not trigger Vercel here. This normal main push starts Quality
          # Gate, whose deployment job waits for validate + browser smoke.
