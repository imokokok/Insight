name: ML Model Retrain

on:
  schedule:
    # Every 3 days at 07:00 UTC (days 1, 4, 7, ... 28, 31). GitHub Actions cron
    # does not support a true "every 3 days" step across month boundaries; this
    # is close enough and stays off the top/bottom of the hour to avoid the
    # GitHub cron load peak.
    - cron: '0 7 */3 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  train:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Verify required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets are required. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Test training data semantics
        run: python -m unittest discover -s ml -p 'test_*.py'

      - name: Train model
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ml/train.py

      - name: Inspect model output
        id: inspect
        run: |
          set -u
          MODEL="ml/models/oracle_risk_model.json"
          if [ ! -f "$MODEL" ]; then
            echo "::error::Trainer produced no model file."
            exit 1
          fi
          # Print metrics for the run log so each scheduled run is reviewable.
          python - <<'PY'
          import json
          m = json.load(open("ml/models/oracle_risk_model.json"))
          print(f"active={m.get('active')} trainedAt={m.get('trainedAt')}")
          print(f"trees={len(m.get('trees', []))}")
          print("metrics=" + json.dumps(m.get("metrics", {}), indent=2))
          if not m.get("active"):
              print(f"inactiveReason={m.get('inactiveReason')}")
          PY

      # A sound but worse candidate is an expected no-update outcome. An invalid
      # comparison/export remains a workflow failure; neither may be published.
      - name: Regression gate (discrimination and calibration)
        id: gate
        run: |
          set +e
          python -m ml.regression_gate
          gate_status=$?
          set -e
          if [ "$gate_status" -eq 0 ]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
          elif [ "$gate_status" -eq 2 ]; then
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Candidate did not meet promotion criteria; deployed model remains unchanged."
            echo "### Model retained" >> "$GITHUB_STEP_SUMMARY"
            echo "The candidate did not meet the regression gate. The deployed model remains unchanged; review the same-window metrics above before the next training cycle." >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$gate_status"
          fi

      # Oracle Watch's dependency-free runner contains the statically imported
      # model. Rebuild it only when training changed the model so scheduled
      # inference never lags behind the deployed application model.
      - name: Check whether model changed
        id: model-diff
        if: steps.gate.outputs.promote == 'true'
        run: |
          if git diff --quiet -- ml/models/oracle_risk_model.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node for cron bundle refresh
        if: steps.model-diff.outputs.changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install bundler dependencies
        if: steps.model-diff.outputs.changed == 'true'
        run: npm ci

      - name: Refresh dependency-free cron bundles
        if: steps.model-diff.outputs.changed == 'true'
        run: npm run build:cron

      - name: Validate the model and generated bundles before publishing
        if: steps.model-diff.outputs.changed == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          INTERNAL_API_SECRET: ci-internal-secret-that-is-not-used-in-production
          CSRF_SECRET: ci-csrf-secret-that-is-not-used-in-production
          JWT_SECRET: ci-jwt-secret-that-is-not-used-in-production
        run: npm run validate:ci

      - name: Install browser for smoke tests
        if: steps.model-diff.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests before publishing
        if: steps.model-diff.outputs.changed == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          INTERNAL_API_SECRET: ci-internal-secret-that-is-not-used-in-production
          CSRF_SECRET: ci-csrf-secret-that-is-not-used-in-production
          JWT_SECRET: ci-jwt-secret-that-is-not-used-in-production
        run: npm run test:e2e -- --project=chromium

      - name: Commit model if changed; Quality Gate owns redeployment
        if: steps.model-diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml/models/oracle_risk_model.json .github/cron-dist
          git commit -m "chore(ml): retrain oracle risk model"
          git push origin HEAD:main

      - name: Start the gated production workflow for the verified model commit
        if: steps.model-diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_sha" != "$expected_sha" ]; then
            echo "::error::main advanced after the verified model update"
            exit 1
          fi
          gh workflow run ci.yml --ref main -f expected_sha="$expected_sha"
