name: ML Model Retrain

on:
  schedule:
    # Every 3 days at 07:00 UTC (days 1, 4, 7, ... 28, 31). GitHub Actions cron
    # does not support a true "every 3 days" step across month boundaries; this
    # is close enough and stays off the top/bottom of the hour to avoid the
    # GitHub cron load peak.
    - cron: '0 7 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Verify required secrets
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets are required. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Train model
        run: python ml/train.py

      - name: Inspect model output
        id: inspect
        run: |
          set -u
          MODEL="ml/models/oracle_risk_model.json"
          if [ ! -f "$MODEL" ]; then
            echo "::error::Trainer produced no model file."
            exit 1
          fi
          # Print metrics for the run log so each scheduled run is reviewable.
          python - <<'PY'
          import json
          m = json.load(open("ml/models/oracle_risk_model.json"))
          print(f"active={m.get('active')} trainedAt={m.get('trainedAt')}")
          print(f"trees={len(m.get('trees', []))}")
          print("metrics=" + json.dumps(m.get("metrics", {}), indent=2))
          if not m.get("active"):
              print(f"inactiveReason={m.get('inactiveReason')}")
          PY

      - name: Commit model if changed and trigger redeploy
        env:
          # Optional: Vercel deploy hook URL. Create one in Vercel → Project →
          # Settings → Git → Deploy Hooks, then add it as a repo secret with the
          # same name. When set, a new model auto-redeploys the app so the
          # build-time-baked model JSON is picked up. When unset, the new model
          # only takes effect on the next manual deploy.
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- ml/models/oracle_risk_model.json; then
            echo "Model unchanged; nothing to commit."
            exit 0
          fi
          git add ml/models/oracle_risk_model.json
          git commit -m "chore(ml): retrain oracle risk model [skip ci]" || true
          git push

          # The model is statically imported (baked at build time), so a repo
          # commit alone doesn't update the running app. Trigger a Vercel rebuild
          # so the new model takes effect automatically.
          if [ -n "${DEPLOY_HOOK_URL:-}" ]; then
            echo "Triggering Vercel deploy hook..."
            curl -s -o /dev/null -w "deploy hook HTTP: %{http_code}\n" --max-time 60 \
              -X POST "$DEPLOY_HOOK_URL" || true
          else
            echo "::warning::VERCEL_DEPLOY_HOOK_URL is not set. The new model will only take effect on the next manual deploy."
          fi
