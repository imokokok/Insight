name: Monad DEX Market Collector

# Index finalized Monad Uniswap V3 Swap events every ten minutes. The runner
# advances a durable cursor and catches up after delayed Actions executions, so
# rolling volumes remain attributable to on-chain event logs rather than an
# unauditable aggregator API. Ten minutes halves recurring cursor writes while
# preserving complete finalized event coverage.

on:
  schedule:
    # Independent fallback, five minutes after the Supabase primary slot. It
    # exits before the collector when the ledger has a fresh primary success.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: 'Supabase cron_dispatch_runs id (empty for manual/fallback runs)'
        required: false
        type: string
      scheduled_for:
        description: 'Supabase scheduled slot (audit only)'
        required: false
        type: string

concurrency:
  group: monad-dex-market
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  CRON_WORKFLOW: monad-dex-market.yml
  CRON_DISPATCH_ID: ${{ inputs.dispatch_id || '' }}
  CRON_SCHEDULED_FOR: ${{ inputs.scheduled_for || '' }}

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check whether native fallback is needed
        id: guard
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FALLBACK_MAX_AGE_MINUTES: '10'
        run: node scripts/cron-control.mjs guard

      - name: Start run ledger
        if: steps.guard.outputs.should_run == 'true'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/cron-control.mjs start

      - name: Index finalized Swap events
        id: index
        if: steps.guard.outputs.should_run == 'true'
        env:
          ALCHEMY_MONAD_RPC: ${{ secrets.ALCHEMY_MONAD_RPC }}
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets are required."
            exit 1
          fi
          node .github/cron-dist/monad-dex-market.mjs

      - name: Finish run ledger
        if: always() && steps.guard.outputs.should_run == 'true'
        env:
          CRON_CONCLUSION: ${{ steps.index.outcome }}
        run: node scripts/cron-control.mjs finish
