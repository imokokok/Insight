name: Production deploy

# Releases main independently of the quality workflow.
#
# `strict` branch protection plus the merge train already prove that the tree was
# tested against the main it lands on. The quality run that starts with this push
# re-executes the same tree, so waiting for it only delays users by minutes. This
# workflow therefore releases immediately, and the live payment-rail smoke decides
# whether the release stays or is rolled back automatically.
#
# It runs in its own workflow with `cancel-in-progress: false` on purpose. The
# previous in-CI deploy job inherited `cancel-in-progress: true`: a newer push
# cancelled the job mid-flight, which skipped every later step and made "roll back
# on failure" impossible. Here a newer push only queues behind the running one.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Commit expected by the operator (empty for manual runs)'
        required: false
        type: string
      rollback_drill:
        description: 'Type ROLLBACK-DRILL to inject an application failure and exercise the automatic rollback'
        required: false
        type: string

# Never cancel. A cancelled run skips the rollback step, and the rollback is the
# whole point of releasing before the post-merge quality run finishes. Queued runs
# execute in push order, so the final state of production is the newest commit.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runtime-impact:
    name: Classify production impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.impact.outputs.runtime }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
      - name: Determine whether this change can affect the running web app
        id: impact
        env:
          # A dispatched run has no reliable comparison, so it releases.
          CHANGE_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$CHANGE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${CHANGE_BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$CHANGE_BASE_SHA"
          fi
          node scripts/determine-runtime-impact.mts

  deploy-production:
    name: Deploy production (gated and verified)
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.runtime-impact.outputs.runtime == 'true'
    needs: runtime-impact
    runs-on: ubuntu-24.04
    permissions:
      # Read-only: the deploy needs the merge metadata of the released commit.
      contents: read
      checks: read
      pull-requests: read
    environment: Production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          cache: npm
      - name: Verify the dispatched commit
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ "$EXPECTED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Dispatch resolved to $GITHUB_SHA instead of $EXPECTED_SHA"
            exit 1
          fi
      - name: Record whether main advanced while this deploy was queued
        # Informational only. Aborting here would skip the rollback step that
        # protects the release this run is already making.
        run: |
          current_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo "::warning::main advanced to $current_sha; this run still releases $GITHUB_SHA and the queued run releases the rest."
          fi
      - name: Verify the merged commit passed its pull-request checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-merged-pr-checks.mts
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare Cloudflare Worker Secrets
        env:
          MPP_ENABLED: ${{ vars.MPP_ENABLED }}
          ALCHEMY_ARBITRUM_RPC: ${{ secrets.ALCHEMY_ARBITRUM_RPC }}
          ALCHEMY_AVALANCHE_RPC: ${{ secrets.ALCHEMY_AVALANCHE_RPC }}
          ALCHEMY_BASE_RPC: ${{ secrets.ALCHEMY_BASE_RPC }}
          ALCHEMY_BNB_RPC: ${{ secrets.ALCHEMY_BNB_RPC }}
          ALCHEMY_ETHEREUM_RPC: ${{ secrets.ALCHEMY_ETHEREUM_RPC }}
          ALCHEMY_LINEA_RPC: ${{ secrets.ALCHEMY_LINEA_RPC }}
          ALCHEMY_MONAD_RPC: ${{ secrets.ALCHEMY_MONAD_RPC }}
          ALCHEMY_OPTIMISM_RPC: ${{ secrets.ALCHEMY_OPTIMISM_RPC }}
          ALCHEMY_POLYGON_RPC: ${{ secrets.ALCHEMY_POLYGON_RPC }}
          ALCHEMY_SOLANA_RPC: ${{ secrets.ALCHEMY_SOLANA_RPC }}
          ATTESTATION_KEYS_CONFIG: ${{ secrets.ATTESTATION_KEYS_CONFIG }}
          ATTESTATION_REVOKED_KEYS_CONFIG: ${{ secrets.ATTESTATION_REVOKED_KEYS_CONFIG }}
          ATTESTATION_SAMPLE_SIGNER_PRIVATE_KEY: ${{ secrets.ATTESTATION_SAMPLE_SIGNER_PRIVATE_KEY }}
          ATTESTATION_SIGNER_PRIVATE_KEY: ${{ secrets.ATTESTATION_SIGNER_PRIVATE_KEY }}
          BEA_API_USER_ID: ${{ secrets.BEA_API_USER_ID }}
          BLS_API_REGISTRATION_KEY: ${{ secrets.BLS_API_REGISTRATION_KEY }}
          COVERAGE_SIGNER_PRIVATE_KEY: ${{ secrets.COVERAGE_SIGNER_PRIVATE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
          ERC8004_REGISTRAR_PRIVATE_KEY: ${{ secrets.ERC8004_REGISTRAR_PRIVATE_KEY }}
          EVM_PRIVATE_KEY: ${{ secrets.EVM_PRIVATE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GOPLUS_API_KEY: ${{ secrets.GOPLUS_API_KEY }}
          GOPLUS_APP_KEY: ${{ secrets.GOPLUS_APP_KEY }}
          GOPLUS_APP_SECRET: ${{ secrets.GOPLUS_APP_SECRET }}
          HEADLESS_ORACLE_API_KEY: ${{ secrets.HEADLESS_ORACLE_API_KEY }}
          HEADLESS_X402_PRIVATE_KEY: ${{ secrets.HEADLESS_X402_PRIVATE_KEY }}
          HELIUS_SOLANA_RPC: ${{ secrets.HELIUS_SOLANA_RPC }}
          INSIGHT_API_KEY: ${{ secrets.INSIGHT_API_KEY }}
          INSIGHT_SOLANA_EVIDENCE_SIGNER_SEED: ${{ secrets.INSIGHT_SOLANA_EVIDENCE_SIGNER_SEED }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MPP_SECRET_KEY: ${{ secrets.MPP_SECRET_KEY }}
          NOWPAYMENTS_API_KEY: ${{ secrets.NOWPAYMENTS_API_KEY }}
          NOWPAYMENTS_IPN_SECRET: ${{ secrets.NOWPAYMENTS_IPN_SECRET }}
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          OPS_OWNER_USER_IDS: ${{ secrets.OPS_OWNER_USER_IDS }}
          POLYMARKET_EVIDENCE_ENABLED: ${{ vars.POLYMARKET_EVIDENCE_ENABLED }}
          POLYMARKET_RULE_BINDINGS_JSON: ${{ secrets.POLYMARKET_RULE_BINDINGS_JSON }}
          REDSTONE_GATEWAY_API_KEY: ${{ secrets.REDSTONE_GATEWAY_API_KEY }}
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          TRON_FULLNODE_RPC: ${{ secrets.TRON_FULLNODE_RPC }}
          TRON_RPC_URL: ${{ secrets.TRON_RPC_URL }}
          TRON_SOLIDITY_RPC: ${{ secrets.TRON_SOLIDITY_RPC }}
          TURSO_OPS_AUTH_TOKEN: ${{ secrets.TURSO_OPS_AUTH_TOKEN }}
          TURSO_OPS_DATABASE_URL: ${{ secrets.TURSO_OPS_DATABASE_URL }}
          TURSO_PRICE_AUTH_TOKEN: ${{ secrets.TURSO_PRICE_AUTH_TOKEN }}
          TURSO_PRICE_DATABASE_URL: ${{ secrets.TURSO_PRICE_DATABASE_URL }}
          X402_CDP_API_KEY_ID: ${{ secrets.X402_CDP_API_KEY_ID }}
          X402_CDP_API_KEY_SECRET: ${{ secrets.X402_CDP_API_KEY_SECRET }}
          X402_ENABLED: ${{ vars.X402_ENABLED }}
          X402_FACILITATOR_BEARER_TOKEN: ${{ secrets.X402_FACILITATOR_BEARER_TOKEN }}
          X402_FACILITATOR_BEARER_TOKENS: ${{ secrets.X402_FACILITATOR_BEARER_TOKENS }}
          X402_FACILITATOR_URL: ${{ vars.X402_FACILITATOR_URL }}
          X402_FACILITATOR_URLS: ${{ vars.X402_FACILITATOR_URLS }}
          X402_NETWORK: ${{ vars.X402_NETWORK }}
          X402_PAY_TO: ${{ vars.X402_PAY_TO }}
          X402_PRICE_USD: ${{ vars.X402_PRICE_USD }}
          X402_HYPERCORE_MERCHANT_SECRET: ${{ secrets.X402_HYPERCORE_MERCHANT_SECRET }}
        run: node --import tsx scripts/write-cloudflare-worker-secrets.mts "$RUNNER_TEMP/insight-worker-secrets.json"
      - name: Deploy the commit to production
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          MPP_ENABLED: ${{ vars.MPP_ENABLED }}
          MPP_MCP_ENABLED: ${{ vars.MPP_MCP_ENABLED }}
          RATE_LIMIT_STORE: ${{ vars.RATE_LIMIT_STORE }}
          TURSO_COVERAGE_SLO_MODE: ${{ vars.TURSO_COVERAGE_SLO_MODE }}
          TURSO_DAILY_REPORTS_MODE: ${{ vars.TURSO_DAILY_REPORTS_MODE }}
          TURSO_DEX_MARKET_MODE: ${{ vars.TURSO_DEX_MARKET_MODE }}
          TURSO_FEED_CADENCE_MODE: ${{ vars.TURSO_FEED_CADENCE_MODE }}
          TURSO_MANIP_COST_MODE: ${{ vars.TURSO_MANIP_COST_MODE }}
          TURSO_MARKET_REF_MODE: ${{ vars.TURSO_MARKET_REF_MODE }}
          TURSO_ORACLE_WATCH_HISTORY_MODE: ${{ vars.TURSO_ORACLE_WATCH_HISTORY_MODE }}
          TURSO_PRICE_PROJECTION_MODE: ${{ vars.TURSO_PRICE_PROJECTION_MODE }}
          TURSO_PRICE_READ_CUTOVER_AT: ${{ vars.TURSO_PRICE_READ_CUTOVER_AT }}
          TURSO_HOURLY_HISTORY_READ_CUTOVER_AT: ${{ vars.TURSO_HOURLY_HISTORY_READ_CUTOVER_AT }}
          TURSO_PRICE_WRITE_MODE: ${{ vars.TURSO_PRICE_WRITE_MODE }}
          WAK_P1_EXTENDED_VALIDITY_UNTIL: ${{ vars.WAK_P1_EXTENDED_VALIDITY_UNTIL }}
          WAK_P1_SIGNED_TTL_SECONDS: ${{ vars.WAK_P1_SIGNED_TTL_SECONDS }}
          X402_EVM_ENABLED: ${{ vars.X402_EVM_ENABLED }}
          X402_EVM_NETWORKS: ${{ vars.X402_EVM_NETWORKS }}
          X402_HYPERCORE_ENABLED: ${{ vars.X402_HYPERCORE_ENABLED }}
          X402_HYPERCORE_FACILITATOR_URL: ${{ vars.X402_HYPERCORE_FACILITATOR_URL }}
          X402_HYPERCORE_MERCHANT_ID: ${{ vars.X402_HYPERCORE_MERCHANT_ID }}
          X402_HYPERCORE_NETWORK: ${{ vars.X402_HYPERCORE_NETWORK }}
          X402_HYPERCORE_PAY_TO: ${{ vars.X402_HYPERCORE_PAY_TO }}
          X402_HYPERCORE_TIMEOUT_MS: ${{ vars.X402_HYPERCORE_TIMEOUT_MS }}
          X402_SOLANA_ENABLED: ${{ vars.X402_SOLANA_ENABLED }}
          X402_SOLANA_FACILITATOR_URL: ${{ vars.X402_SOLANA_FACILITATOR_URL }}
          X402_SOLANA_FEE_PAYER: ${{ vars.X402_SOLANA_FEE_PAYER }}
          X402_SOLANA_NETWORK: ${{ vars.X402_SOLANA_NETWORK }}
          X402_SOLANA_PAY_TO: ${{ vars.X402_SOLANA_PAY_TO }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is required for gated production deployment" >&2
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is required for gated production deployment" >&2
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY are required for the production build" >&2
            exit 1
          fi
          RELEASE_MESSAGE="$GITHUB_SHA via GitHub Actions run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          npm run build:vinext
          npx cf deploy --prebuilt --secrets-file "$RUNNER_TEMP/insight-worker-secrets.json" --tag "$GITHUB_SHA" --message "$RELEASE_MESSAGE"

      # The live smoke below probes the public domain, so it can only prove the
      # release if the domain actually serves it. A READY (even STAGED) deployment
      # with aliasAssigned=true is not enough: assert the domain's commit first.
      - name: Assert the production domain serves the released commit
        env:
          PRODUCTION_BASE_URL: https://www.oracleinsight.xyz
        run: node scripts/assert-production-domain-commit.mts

      # A READY deployment only proves the build succeeded. Probe the live
      # pay-per-call challenge paths so a regression that still builds (e.g. the
      # Next 16.4 homepage-artifact incident) cannot reach users silently.
      # Exit codes decide the recovery path: 1 = application failure (roll back),
      # 2 = infrastructure failure (retry, never roll back on a flake).
      - name: Live smoke the payment rails
        id: live-smoke
        env:
          SMOKE_BASE_URL: https://www.oracleinsight.xyz
          SMOKE_EXPECT_MPP: ${{ vars.SMOKE_EXPECT_MPP || 'true' }}
          ROLLBACK_DRILL: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_drill || '' }}
        run: |
          set -uo pipefail
          if [ "$ROLLBACK_DRILL" = "ROLLBACK-DRILL" ]; then
            echo "::warning::Rollback drill requested: injecting an application-class failure."
            echo "classification=application" >> "$GITHUB_OUTPUT"
            echo "::error::Injected live payment-rail smoke failure (rollback drill)."
            exit 1
          fi
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if node scripts/smoke-live-payment-rails.mjs; then
              echo "classification=none" >> "$GITHUB_OUTPUT"
              exit 0
            else
              rc=$?
            fi
            if [ "$rc" -eq 1 ]; then
              echo "::error::Live payment-rail smoke failed an application contract check; rolling back."
              echo "classification=application" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "::warning::Live payment-rail smoke could not reach the application (exit $rc); infrastructure attempt $attempt of 3."
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
            attempt=$((attempt + 1))
          done
          echo "::error::Live smoke never reached an application verdict after 3 infrastructure attempts; not rolling back automatically. Verify manually with scripts/smoke-live-payment-rails.mjs."
          echo "classification=infrastructure" >> "$GITHUB_OUTPUT"
          exit 1

      # The rollback runs only for an application-class failure and only while
      # production still serves the deployment this run released. If a queued
      # newer release already owns production, reverting it would be wrong.
      - name: Roll back after an application failure
        id: rollback
        if: failure() && steps.live-smoke.outcome == 'failure' && steps.live-smoke.outputs.classification == 'application'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_BASE_URL: https://www.oracleinsight.xyz
        run: node --import tsx scripts/auto-rollback-cloudflare.mts

      - name: Verify the release that was restored
        if: failure() && steps.rollback.outputs.rollback == 'executed'
        env:
          SMOKE_BASE_URL: https://www.oracleinsight.xyz
          SMOKE_EXPECT_MPP: ${{ vars.SMOKE_EXPECT_MPP || 'true' }}
        run: node scripts/smoke-live-payment-rails.mjs
