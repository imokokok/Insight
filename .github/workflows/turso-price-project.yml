name: Turso Price Projection

# The collector durably commits to Turso first. This separate worker delivers
# the immutable outbox to Supabase, so transient Supabase failures never delay
# high-frequency price collection. Every delivery is receipt-backed and
# idempotent.
on:
  schedule:
    # This is only a fallback. Supabase's primary dispatcher invokes this
    # workflow at the same offsets and records the run in its durable ledger.
    # GitHub schedule events are intentionally not the primary delivery path.
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: 'Supabase cron_dispatch_runs id (empty for manual/fallback runs)'
        required: false
        type: string
      scheduled_for:
        description: 'Supabase scheduled slot (audit only)'
        required: false
        type: string

concurrency:
  group: turso-price-projection
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  TURSO_PRICE_DATABASE_URL: libsql://insight-imokokok.aws-ap-southeast-1.turso.io
  TURSO_PRICE_AUTH_TOKEN: ${{ secrets.TURSO_PRICE_AUTH_TOKEN }}
  TURSO_PRICE_PARTITION_KEY: ${{ vars.TURSO_PRICE_PARTITION_KEY || 'bootstrap' }}
  TURSO_PRICE_WRITE_MODE: ${{ vars.TURSO_PRICE_WRITE_MODE || 'legacy' }}
  TURSO_PRICE_READ_CUTOVER_AT: ${{ vars.TURSO_PRICE_READ_CUTOVER_AT || '' }}
  # Defaults are enforced in the TypeScript runner; variables permit an
  # operator to tighten the SLO without changing source.
  TURSO_PRICE_PROJECTION_BATCH_SIZE: ${{ vars.TURSO_PRICE_PROJECTION_BATCH_SIZE || '16' }}
  TURSO_PRICE_PROJECTION_MAX_LAG_SECONDS: ${{ vars.TURSO_PRICE_PROJECTION_MAX_LAG_SECONDS || '1800' }}
  TURSO_PRICE_RAW_RETENTION_DAYS: ${{ vars.TURSO_PRICE_RAW_RETENTION_DAYS || '30' }}
  CRON_WORKFLOW: turso-price-project.yml
  CRON_DISPATCH_ID: ${{ inputs.dispatch_id || '' }}
  CRON_SCHEDULED_FOR: ${{ inputs.scheduled_for || '' }}

jobs:
  project:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check whether native fallback is needed
        id: guard
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FALLBACK_MAX_AGE_MINUTES: '25'
        run: node scripts/cron-control.mjs guard

      - name: Verify required secrets
        if: steps.guard.outputs.should_run == 'true'
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ] || [ -z "${TURSO_PRICE_AUTH_TOKEN}" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and TURSO_PRICE_AUTH_TOKEN are required."
            exit 1
          fi

      - name: Start run ledger
        if: steps.guard.outputs.should_run == 'true'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/cron-control.mjs start

      - name: Project pending Turso price slots
        if: steps.guard.outputs.should_run == 'true'
        run: node .github/cron-dist/project-turso-price.mjs

      - name: Finish run ledger
        if: always() && steps.guard.outputs.should_run == 'true'
        env:
          CRON_CONCLUSION: ${{ job.status }}
        run: node scripts/cron-control.mjs finish
