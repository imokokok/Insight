name: Oracle Watch Collect

# Low-frequency feed-health snapshot collection for the Oracle Watch time-series
# spine (feed_health_snapshots). Runs DIRECTLY on the GitHub runner (not a curl
# to a Vercel function) so it escapes the 60s serverless timeout — a collection
# pass fans out live cross-oracle fetches across ~16 symbols.
#
# Every 30 minutes: evaluates each target through getOracleWatchSignal (live
# consensus + ML manipulation risk + provider reputation) and appends one row
# per symbol to feed_health_snapshots, which powers /api/v1/oracle-watch/history.

on:
  schedule:
    # Same nominal cadence as before; the stale-ledger guard skips healthy slots.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: 'Supabase cron_dispatch_runs id'
        required: false
        type: string
      scheduled_for:
        description: 'Supabase scheduled slot (audit only)'
        required: false
        type: string

# Prevent overlapping runs. If one exceeds 30 min (almost never — typical
# runtime is well under 2 min), queue rather than cancel (same reasoning as
# snapshot-collect).
concurrency:
  group: oracle-watch-collect
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  CRON_WORKFLOW: oracle-watch-collect.yml
  CRON_DISPATCH_ID: ${{ inputs.dispatch_id || '' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check whether native fallback is needed
        id: guard
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FALLBACK_MAX_AGE_MINUTES: '50'
        run: node scripts/cron-control.mjs guard

      - name: Verify required secrets
        if: steps.guard.outputs.should_run == 'true'
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets are required (same secrets already used by snapshot-collect / ml-train-cron)."
            exit 1
          fi

      - name: Start run ledger
        if: steps.guard.outputs.should_run == 'true'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/cron-control.mjs start

      - name: Collect Oracle Watch snapshots
        if: steps.guard.outputs.should_run == 'true'
        run: node .github/cron-dist/collect-oracle-watch.mjs

      - name: Finish run ledger
        if: always() && steps.guard.outputs.should_run == 'true'
        env:
          CRON_CONCLUSION: ${{ job.status }}
        run: node scripts/cron-control.mjs finish
