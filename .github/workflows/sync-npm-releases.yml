name: Sync npm releases

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-npm-releases
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      INTERNAL_API_SECRET: ci-internal-secret-that-is-not-used-in-production
      CSRF_SECRET: ci-csrf-secret-that-is-not-used-in-production
      JWT_SECRET: ci-jwt-secret-that-is-not-used-in-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          cache: npm
      - name: Check whether tracked releases changed
        id: release-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json headRefName,url --jq 'first(.[] | select(.headRefName | startswith("automation/npm-release-")) | .url)')"
          if [ -n "$existing" ]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo "::notice::An npm release PR is already open: $existing"
          else
            node scripts/check-npm-releases.mts
          fi
      - run: npm ci
        if: steps.release-check.outputs.needed == 'true'
      - name: Read npm latest tags and update tracked files
        if: steps.release-check.outputs.needed == 'true'
        run: npm run sync:npm-releases
      - name: Refresh cron bundles for any dependency change
        if: steps.release-check.outputs.needed == 'true'
        run: npm run build:cron
      - name: Detect an available release
        if: steps.release-check.outputs.needed == 'true'
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- package.json package-lock.json src/lib/npmPackageVersions.ts .github/cron-dist)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All tracked npm packages are current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # Generated chunks may contain whitespace from upstream literals;
            # validate:ci verifies their exact bytes against a fresh build.
            git diff --check -- package.json package-lock.json src/lib/npmPackageVersions.ts
            git diff --stat
          fi
      - name: Run the full validation suite
        if: steps.changes.outputs.changed == 'true'
        run: npm run validate:ci
      - name: Install the browser used by smoke tests
        if: steps.changes.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        if: steps.changes.outputs.changed == 'true'
        run: npm run test:e2e -- --project=chromium
      - name: Publish the verified release as a pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run publish:automation-pr -- npm-release
