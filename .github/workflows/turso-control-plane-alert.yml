name: Turso Control Plane Alert

on:
  # Deliberately no `schedule:`: GitHub's best-effort native cron dropped most
  # of even this 30-minute cadence (8 runs in 2 days against the nominal 48)
  # and the 2026-11-08 3.5h capture outage produced zero issues. Supabase
  # pg_cron dispatches this workflow hourly at :10 via migration 0143
  # (`github-dispatch-turso-control-plane-alert`). 0142 dispatched it every
  # 15 minutes, but the workflow was missing from the dispatcher allowlist, so
  # every run failed. Hourly still detects a stopped capture within 55 minutes
  # (25-minute readiness scheduler threshold plus the :10 poll).
  # `workflow_dispatch` stays for manual runs. The dispatcher always sends
  # `dispatch_id` and `scheduled_for`; GitHub rejects undeclared inputs with
  # HTTP 422 "Unexpected inputs provided", so both must be declared here.
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: 'Supabase cron_dispatch_runs id'
        required: false
        type: string
      scheduled_for:
        description: 'Supabase scheduled slot (audit only)'
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: write

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  CRON_WORKFLOW: turso-control-plane-alert.yml
  CRON_DISPATCH_ID: ${{ inputs.dispatch_id || '' }}
  CRON_SCHEDULED_FOR: ${{ inputs.scheduled_for || '' }}

jobs:
  readiness:
    environment: Production
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check authenticated Supabase and Turso readiness
        id: readiness
        env:
          READINESS_URL: https://www.oracleinsight.xyz/api/v1/health/ready?deep=1
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          if [ -z "${CRON_SECRET:-}" ]; then
            echo '::error::CRON_SECRET is required for the deep readiness check.'
            echo 'healthy=false' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 20 --header "Authorization: Bearer ${CRON_SECRET}" --output "$response_file" --write-out '%{http_code}' "$READINESS_URL" || true)"
          summary="$(python3 - "$response_file" <<'PY'
          import json
          import sys
          try:
              payload = json.load(open(sys.argv[1], encoding='utf-8'))
              data = payload.get('data') or {}
              if payload.get('success') is True:
                  print('status=' + str(data.get('status', 'unknown')) + '; checks=' + json.dumps(data.get('checks', {}), sort_keys=True))
              else:
                  error = payload.get('error') or {}
                  details = error.get('details') or {}
                  print('error=' + str(error.get('code', 'unknown')) + '; message=' + str(error.get('message', 'unavailable')) + '; details=' + json.dumps(details, sort_keys=True))
          except Exception:
              print('response=unparseable')
          PY
          )"
          if [ "$status" = '200' ] && python3 - "$response_file" <<'PY'
          import json
          import sys
          try:
              payload = json.load(open(sys.argv[1], encoding='utf-8'))
              ready = payload.get('success') is True and (payload.get('data') or {}).get('status') == 'ready'
          except Exception:
              ready = False
          raise SystemExit(0 if ready else 1)
          PY
          then
            echo 'healthy=true' >> "$GITHUB_OUTPUT"
            echo "Turso/Supabase deep readiness passed: $summary"
            exit 0
          fi
          echo 'healthy=false' >> "$GITHUB_OUTPUT"
          {
            echo 'body<<EOF'
            echo "Automated deep readiness check failed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')."
            echo
            echo "HTTP status: ${status:-transport-error}"
            echo "Readiness summary: $summary"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "::error::Turso/Supabase deep readiness failed (HTTP ${status:-transport-error}): $summary"
          exit 1

      # Reuse the existing Supabase-dispatched hourly watchdog. This adds no
      # new schedule or service and catches a missed/failed export even when
      # GitHub's native schedule is delayed or skipped.
      - name: Check database backup freshness
        id: backups
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          healthy=true
          summary_file="$(mktemp)"
          body_file="$(mktemp)"
          # Fail closed if the probe itself exits early; the issue step still
          # runs because it uses `if: always()` below.
          echo 'healthy=false' >> "$GITHUB_OUTPUT"
          while IFS='|' read -r label workflow_file max_age_hours; do
            if ! latest="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow_file" \
              --branch main \
              --limit 20 \
              --json conclusion,createdAt \
              --jq '[.[] | select(.conclusion == "success")] | .[0].createdAt // empty')"; then
              healthy=false
              printf '%s: GitHub Actions history query failed.\n' "$label" >> "$summary_file"
              printf -- '- %s: GitHub Actions history query failed.\n' "$label" >> "$body_file"
              continue
            fi
            if [ -z "$latest" ]; then
              healthy=false
              printf '%s: no successful run found in the latest 20 runs.\n' "$label" >> "$summary_file"
              printf -- '- %s: no successful run found in the latest 20 runs.\n' "$label" >> "$body_file"
              continue
            fi

            latest_epoch="$(date -u -d "$latest" +%s)"
            age_seconds=$((now - latest_epoch))
            max_age_seconds=$((max_age_hours * 3600))
            age_hours=$((age_seconds / 3600))
            if [ "$age_seconds" -gt "$max_age_seconds" ]; then
              healthy=false
              printf '%s: latest success %s (%sh old; limit %sh).\n' \
                "$label" "$latest" "$age_hours" "$max_age_hours" >> "$summary_file"
              printf -- '- %s: latest success %s (%sh old; limit %sh).\n' \
                "$label" "$latest" "$age_hours" "$max_age_hours" >> "$body_file"
            else
              printf '%s: latest success %s (%sh old).\n' \
                "$label" "$latest" "$age_hours" >> "$summary_file"
            fi
          done <<'BACKUPS'
          Turso ops|turso-ops-backup.yml|36
          Supabase assets|supabase-assets-backup.yml|36
          Supabase archives|supabase-archives-backup.yml|1000
          BACKUPS

          echo "healthy=$healthy" >> "$GITHUB_OUTPUT"
          {
            echo 'summary<<EOF'
            cat "$summary_file"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          if [ "$healthy" = false ]; then
            {
              echo 'body<<EOF'
              echo "A scheduled database backup is missing or stale as of $(date -u +'%Y-%m-%dT%H:%M:%SZ')."
              cat "$body_file"
              echo EOF
            } >> "$GITHUB_OUTPUT"
            echo "::error::One or more database backups are stale."
          else
            echo "Database backups are within their freshness limits."
            cat "$summary_file"
          fi

      - name: Open or resolve the incident issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTHY: ${{ steps.readiness.outputs.healthy }}
          INCIDENT_BODY: ${{ steps.readiness.outputs.body }}
        run: |
          set -euo pipefail
          title="[Turso Control Plane] readiness degraded"
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number --jq ".[0].number // empty")"
          if [ "$HEALTHY" = "true" ]; then
            if [ -n "$issue_number" ]; then
              gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "Automated recovery check passed at $(date -u +%Y-%m-%dT%H:%M:%SZ). Closing this incident."
              gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY"
            fi
            exit 0
          fi
          if [ -z "$issue_number" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$INCIDENT_BODY"
          else
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$INCIDENT_BODY"
          fi

      - name: Open or resolve the backup incident issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUPS_HEALTHY: ${{ steps.backups.outputs.healthy }}
          BACKUP_SUMMARY: ${{ steps.backups.outputs.summary }}
          BACKUP_BODY: ${{ steps.backups.outputs.body }}
        run: |
          set -euo pipefail
          title='[Insight Backup] scheduled exports missing or stale'
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
          if [ "$BACKUPS_HEALTHY" = true ]; then
            if [ -n "$issue_number" ]; then
              recovery_body="$(printf 'All scheduled database backups recovered at %s. Closing this incident.\n\n%s' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$BACKUP_SUMMARY")"
              gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$recovery_body"
              gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY"
            fi
            exit 0
          fi
          if [ -z "$BACKUP_BODY" ]; then
            BACKUP_BODY="Backup freshness probe did not complete. Review workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          if [ -z "$issue_number" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$BACKUP_BODY"
          else
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$BACKUP_BODY"
          fi

      - name: Fail the run when backups are stale
        if: steps.backups.outputs.healthy == 'false'
        run: exit 1

      # Supabase owns the clock and inserts the dispatch row before GitHub
      # starts. Report this run's conclusion so the row reaches a terminal
      # state instead of being reaped as timed_out by mark-stale.
      - name: Finish dispatch ledger
        if: always() && env.CRON_DISPATCH_ID != ''
        env:
          CRON_CONCLUSION: ${{ job.status }}
        run: node scripts/cron-control.mjs finish
