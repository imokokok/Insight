name: Safety Outcome Backfill

# Backfills outcome labels for pre-trade safety checks whose evaluation window
# has elapsed. Each run labels a bounded batch of the oldest unlabeled checks
# against hourly_price_snapshots, turning flywheel rows into labeled training
# examples.
#
# Runs the `scripts/safety-outcome.ts` runner directly on GH Actions (no
# Vercel curl) so the job escapes Vercel's 60s serverless timeout — the
# backfill joins against hourly_price_snapshots and can exceed the ceiling
# during cold-start DB connection latency. Delegates to the same
# `runSafetyOutcomeBackfill()` used by the HTTP route, so behaviour is
# identical — only the executor changes.

on:
  schedule:
    # Every 2 hours at minute 15 (offset from other crons; eval window is 6h)
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Run safety outcome backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/safety-outcome.ts
