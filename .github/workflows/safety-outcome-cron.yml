name: Safety Outcome Backfill

on:
  schedule:
    # Every 2 hours at minute 15 (offset from other crons; eval window is 6h)
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://www.oracleinsight.xyz' }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  safety-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger safety outcome backfill
        run: |
          set -u
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET secret is not configured. Add it under Settings → Secrets and variables → Actions (must match the cron_secret stored in cron_config)."
            exit 1
          fi

          BASE_URL="${SITE_URL%/}"
          echo "Triggering safety outcome backfill..."

          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 180 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/cron/safety-outcome" || true)

          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1 | tr -d '[:space:]')
          case "$HTTP_CODE" in ''|*[!0-9]*) HTTP_CODE="000" ;; esac
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')

          echo "HTTP Status: ${HTTP_CODE}"
          echo "Response: ${BODY}"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Safety outcome backfill failed: HTTP ${HTTP_CODE}"
            exit 1
          fi
