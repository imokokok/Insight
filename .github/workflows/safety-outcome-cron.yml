name: Safety Outcome Backfill

# Backfills outcome labels for pre-trade safety checks whose evaluation window
# has elapsed. Each run labels a bounded batch of the oldest unlabeled checks
# against hourly_price_snapshots, turning flywheel rows into labeled training
# examples.
#
# Runs the `scripts/safety-outcome.ts` runner directly on GH Actions (no
# Vercel curl) so the job escapes Vercel's 60s serverless timeout — the
# backfill joins against hourly_price_snapshots and can exceed the ceiling
# during cold-start DB connection latency. Delegates to the same
# `runSafetyOutcomeBackfill()` used by the HTTP route, so behaviour is
# identical — only the executor changes.

on:
  schedule:
    # Existing two-hour clock remains as a guarded fallback.
    - cron: '15 */2 * * *'
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: 'Supabase cron_dispatch_runs id'
        required: false
        type: string
      scheduled_for:
        description: 'Supabase scheduled slot (audit only)'
        required: false
        type: string

# Prevent overlapping runs. If a run is still queued or in progress when the
# next 2-hourly schedule fires, the new run queues and waits rather than
# starting in parallel. cancel-in-progress: false (not true) avoids the
# cascading-cancellation issue that affected snapshot-collect.yml when the
# runner fleet was temporarily unavailable.
concurrency:
  group: safety-outcome-backfill
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  CRON_WORKFLOW: safety-outcome-cron.yml
  CRON_DISPATCH_ID: ${{ inputs.dispatch_id || '' }}

jobs:
  safety-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check whether native fallback is needed
        id: guard
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FALLBACK_MAX_AGE_MINUTES: '150'
        run: node scripts/cron-control.mjs guard

      - name: Start run ledger
        if: steps.guard.outputs.should_run == 'true'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/cron-control.mjs start

      - name: Run safety outcome backfill
        if: steps.guard.outputs.should_run == 'true'
        run: node .github/cron-dist/safety-outcome.mjs

      - name: Finish run ledger
        if: always() && steps.guard.outputs.should_run == 'true'
        env:
          CRON_CONCLUSION: ${{ job.status }}
        run: node scripts/cron-control.mjs finish
