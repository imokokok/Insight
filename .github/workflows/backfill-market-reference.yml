name: Backfill Market Reference

# One-shot historical backfill of the external truth layer. Pulls
# BACKFILL_DAYS of hourly candles from Coinbase Exchange and Kraken, plus
# Crypto.com WBTC/USD and (when commercially licensed) Bitstamp and Bitfinex
# direct USD spot candles and Binance's WBTC/USDT × USDT/USD cross-market price,
# then upserts them into `market_reference_snapshots` (migration 0038 must be
# applied first; migration 0087 is required for the optional licensed sources).
#
# Trigger manually: Actions → Backfill Market Reference → Run workflow →
# set "days" (default 90). Idempotent (upsert with ignoreDuplicates), safe to
# re-run after a partial failure.
# Set MARKET_REFERENCE_LICENSED_EXCHANGES only after written commercial data
# rights are confirmed and migration 0087 has been applied. Binance's dedicated
# public market-data endpoint still needs a GitHub-runner availability check.

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of history to backfill'
        required: false
        default: '90'
        type: number

concurrency:
  group: market-reference-backfill
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  BACKFILL_DAYS: ${{ inputs.days || '90' }}
  MARKET_REFERENCE_LICENSED_EXCHANGES: ${{ vars.MARKET_REFERENCE_LICENSED_EXCHANGES }}

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify required secrets
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets are required."
            exit 1
          fi

      - name: Backfill market reference
        run: node .github/cron-dist/backfill-market-reference.mjs --days="${BACKFILL_DAYS}"
