name: Daily Report Hourly Snapshot

# Manual-trigger fallback for the hourly price-snapshot collection.
#
# Scheduled collection has moved to `snapshot-collect.yml` (every 15 min),
# which runs `scripts/collect-snapshot.ts` directly on GH Actions and
# dual-writes both `hourly_price_snapshots` (upsert) and `price_snapshots`
# (append). The 15-min collector's :00 run supersedes this hourly cron, so
# the schedule is removed to avoid a redundant double-write at the top of
# each hour.
#
# This workflow is retained as a `workflow_dispatch` fallback — it curls the
# Vercel `/api/cron/daily-report` route (which calls the same `collectSnapshot()`
# pipeline) so an operator can manually trigger a snapshot if the 15-min
# collector is ever misconfigured or needs a one-off catch-up run.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://www.oracleinsight.xyz' }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  collect-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger daily report snapshot
        run: |
          set -u
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET secret is not configured. Add it under Settings → Secrets and variables → Actions (must match the cron_secret stored in cron_config)."
            exit 1
          fi

          BASE_URL="${SITE_URL%/}"
          echo "Triggering daily report snapshot..."

          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/cron/daily-report" || true)

          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1 | tr -d '[:space:]')
          case "$HTTP_CODE" in ''|*[!0-9]*) HTTP_CODE="000" ;; esac
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')

          echo "HTTP Status: ${HTTP_CODE}"
          echo "Response: ${BODY}"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Daily report snapshot failed: HTTP ${HTTP_CODE}"
            exit 1
          fi
