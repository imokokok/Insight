name: Protocol TVL Sync

# Syncs protocol TVL figures from upstream sources (DefiLlama etc.) into the
# protocol_metrics table.
#
# Runs the `scripts/protocol-metrics.ts` runner directly on GH Actions (no
# Vercel curl) so the job escapes Vercel's 60s serverless timeout. Delegates
# to the same `runProtocolMetrics()` used by the HTTP route, so behaviour is
# identical — only the executor changes.

on:
  schedule:
    # Every 4 hours at minute 0
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-tvl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Run protocol TVL sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/protocol-metrics.ts --mode=tvl
