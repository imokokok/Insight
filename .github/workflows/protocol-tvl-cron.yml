name: Protocol TVL Sync

on:
  schedule:
    # Every 4 hours at minute 0
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://www.oracleinsight.xyz' }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  sync-tvl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger protocol TVL sync
        run: |
          set -u
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET secret is not configured. Add it under Settings → Secrets and variables → Actions (must match the cron_secret stored in cron_config)."
            exit 1
          fi

          BASE_URL="${SITE_URL%/}"
          echo "Triggering protocol TVL sync..."

          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/cron/protocol-metrics?mode=tvl" || true)

          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1 | tr -d '[:space:]')
          case "$HTTP_CODE" in ''|*[!0-9]*) HTTP_CODE="000" ;; esac
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')

          echo "HTTP Status: ${HTTP_CODE}"
          echo "Response: ${BODY}"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Protocol TVL sync failed: HTTP ${HTTP_CODE}"
            exit 1
          fi
