name: Repair Dependabot npm lockfile

on:
  workflow_run:
    workflows: [Quality Gate]
    types: [completed]

concurrency:
  group: dependabot-lock-repair-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  repair:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted repair logic
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Set up the repository Node.js version
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          cache: npm

      - name: Verify the failed run and pull request are eligible
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/inspect-dependabot-lock-repair.mts

      - name: Checkout the immutable Dependabot head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ steps.inspect.outputs.sha }}

      - name: Rebuild the lockfile and generated cron bundles safely
        id: repair
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:cron
          if git diff --quiet -- package-lock.json .github/cron-dist; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'The lockfile and cron bundles are already current; the failure needs normal review.'
            exit 0
          fi
          unexpected="$(git diff --name-only -- . ':(exclude)package-lock.json' ':(exclude).github/cron-dist')"
          if [ -n "$unexpected" ]; then
            echo "::error::repair changed files outside the lockfile and cron bundles: $unexpected"
            exit 1
          fi
          git diff --check -- package-lock.json .github/cron-dist
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Publish the repaired lockfile to the existing pull request
        id: publish
        if: steps.repair.outputs.changed == 'true'
        env:
          HEAD_BRANCH: ${{ steps.inspect.outputs.branch }}
        run: |
          git config user.name 'imokokok'
          git config user.email '145034722+imokokok@users.noreply.github.com'
          git add package-lock.json .github/cron-dist
          git commit --no-verify -m 'chore(deps): repair generated dependency artifacts'
          identity="$(git show -s --format='%an <%ae>%n%cn <%ce>' HEAD)"
          expected="$(printf '%s\n%s' 'imokokok <145034722+imokokok@users.noreply.github.com>' 'imokokok <145034722+imokokok@users.noreply.github.com>')"
          if [ "$identity" != "$expected" ]; then
            echo '::error::automation commit identity does not match repository policy'
            exit 1
          fi
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Approve native required checks for the repaired commit
        if: steps.repair.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.publish.outputs.sha }}
        run: node scripts/approve-dependabot-workflow-runs.mts
