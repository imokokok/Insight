name: Turso Backup

# Nightly logical export of every Turso table to a GH Actions artifact,
# followed by the retention prune. The Turso free tier keeps only 1 day of
# point-in-time restore; this 90-day artifact trail is the durable safety
# net for the Supabase egress-retirement migration (2026-11).
#
# Order matters: export first, prune second — every deleted row already
# lives in the exported artifact. The prune enforces the bounded raw-stream
# retention window the price schema promises (price_snapshots grows
# ~21-25k rows/day and would hit the 5 GB free-tier storage cap unbounded).

on:
  schedule:
    # 05:37 UTC daily — deliberately off the :00/:10/:25/:40/:55 dispatch
    # minutes so it never collides with the collect/projection cadence.
    - cron: '37 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: turso-backup
  cancel-in-progress: false

jobs:
  backup-and-prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export tables
        env:
          TURSO_OPS_DATABASE_URL: ${{ secrets.TURSO_PRICE_DATABASE_URL }}
          TURSO_OPS_AUTH_TOKEN: ${{ secrets.TURSO_PRICE_AUTH_TOKEN }}
        run: npx tsx scripts/turso/backup-export.mts

      - name: Upload backup artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: turso-backup
          path: artifacts/turso-backup/
          retention-days: 90
          if-no-files-found: error

      - name: Prune expired rows (retention)
        env:
          TURSO_OPS_DATABASE_URL: ${{ secrets.TURSO_PRICE_DATABASE_URL }}
          TURSO_OPS_AUTH_TOKEN: ${{ secrets.TURSO_PRICE_AUTH_TOKEN }}
        run: npx tsx scripts/turso/retention-prune.mts
