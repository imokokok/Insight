name: ERC-8004 reputation anchor

# Opt-in M2: writes queued paid-check feedback to the BNB Chain Reputation
# Registry once per day. Consumes reputation_anchor_queue rows produced by the
# pre-trade route after opted-in x402 settlements.

on:
  # Daily schedule paused for now — re-enable by restoring:
  #   schedule:
  #     - cron: '23 2 * * *'
  # until then the batch runs only via manual workflow_dispatch.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: erc8004-anchor-cron
  cancel-in-progress: false

jobs:
  anchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Node 22+: supabase-js requires a native WebSocket (Node 20 lacks one).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2

      - name: Run anchor batch (no install, checked-in bundle)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ERC8004_REGISTRAR_PRIVATE_KEY: ${{ secrets.ERC8004_REGISTRAR_PRIVATE_KEY }}
          ALCHEMY_BNB_RPC: ${{ secrets.ALCHEMY_BNB_RPC }}
        run: node .github/cron-dist/erc8004-anchor.mjs
