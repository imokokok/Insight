name: Feed Cadence Baselines

# Maintains observed_data_age_p90_s directly from a GitHub runner. This keeps
# the optional cadence-relative CAUTION signal warm without spending Vercel
# Active CPU or relying on a pg_net HTTP call.

on:
  schedule:
    # One-hour-later stale fallback. Supabase owns the primary 02:23 UTC slot.
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: 'Supabase cron_dispatch_runs id'
        required: false
        type: string
      scheduled_for:
        description: 'Supabase scheduled slot (audit only)'
        required: false
        type: string

concurrency:
  group: feed-cadence-baselines
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  CRON_WORKFLOW: feed-cadence-cron.yml
  CRON_DISPATCH_ID: ${{ inputs.dispatch_id || '' }}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check whether native fallback is needed
        id: guard
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FALLBACK_MAX_AGE_MINUTES: '1560'
        run: node scripts/cron-control.mjs guard

      - name: Start run ledger
        if: steps.guard.outputs.should_run == 'true'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/cron-control.mjs start

      - name: Update feed cadence baselines
        if: steps.guard.outputs.should_run == 'true'
        run: node .github/cron-dist/feed-cadence.mjs

      - name: Finish run ledger
        if: always() && steps.guard.outputs.should_run == 'true'
        env:
          CRON_CONCLUSION: ${{ job.status }}
        run: node scripts/cron-control.mjs finish
