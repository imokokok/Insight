name: Reputation Calculation

on:
  schedule:
    # Every 6 hours at minute 0
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://insight-oracle.vercel.app' }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  calculate-reputation:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reputation cron
        run: |
          BASE_URL="${SITE_URL%/}"
          echo "Triggering reputation calculation..."

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/cron/reputation")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: ${HTTP_CODE}"
          echo "Response: ${BODY}"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Reputation calculation failed: HTTP ${HTTP_CODE}"
            exit 1
          fi
