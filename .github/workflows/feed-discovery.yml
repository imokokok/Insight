name: Weekly Feed Discovery

# Discover (or re-seed) oracle feeds from each provider's official API, then
# verify each candidate by actually fetching a price before upserting. Runs
# weekly so newly-listed feeds are picked up without manual intervention.
#
# Runs the `scripts/sync-feeds.ts` runner directly on GH Actions (no Vercel
# curl). This escapes Vercel's 60s serverless timeout — critical for
# `discover` mode, which probes every candidate feed for a provider and
# previously got truncated mid-run on Vercel. Delegates to the same
# `runFeedSync()` used by the HTTP route, so behaviour is identical — only
# the executor changes.

on:
  schedule:
    # Every Monday at 4:00 AM UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode (seed or discover)'
        required: false
        default: 'discover'
      provider:
        description: 'Single provider to sync (empty = all in matrix)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  discover-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        provider:
          - chainlink
          - supra
          - dia
          - redstone
          - api3
          - winklink
          - twap
          - twap-token
          - reflector
          - flare
          - switchboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Discover ${{ matrix.provider }} feeds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Alchemy RPC keys (optional — public RPC fallbacks exist).
          ALCHEMY_ETHEREUM_RPC: ${{ secrets.ALCHEMY_ETHEREUM_RPC }}
          ALCHEMY_ARBITRUM_RPC: ${{ secrets.ALCHEMY_ARBITRUM_RPC }}
          ALCHEMY_OPTIMISM_RPC: ${{ secrets.ALCHEMY_OPTIMISM_RPC }}
          ALCHEMY_POLYGON_RPC: ${{ secrets.ALCHEMY_POLYGON_RPC }}
          ALCHEMY_BASE_RPC: ${{ secrets.ALCHEMY_BASE_RPC }}
          ALCHEMY_BNB_RPC: ${{ secrets.ALCHEMY_BNB_RPC }}
          ALCHEMY_AVALANCHE_RPC: ${{ secrets.ALCHEMY_AVALANCHE_RPC }}
          ALCHEMY_ZKSYNC_RPC: ${{ secrets.ALCHEMY_ZKSYNC_RPC }}
          ALCHEMY_SCROLL_RPC: ${{ secrets.ALCHEMY_SCROLL_RPC }}
          ALCHEMY_MANTLE_RPC: ${{ secrets.ALCHEMY_MANTLE_RPC }}
          ALCHEMY_LINEA_RPC: ${{ secrets.ALCHEMY_LINEA_RPC }}
          ALCHEMY_SOLANA_RPC: ${{ secrets.ALCHEMY_SOLANA_RPC }}
          TRON_RPC_URL: ${{ secrets.TRON_RPC_URL }}
          TRON_SOLIDITY_RPC: ${{ secrets.TRON_SOLIDITY_RPC }}
          TRON_FULLNODE_RPC: ${{ secrets.TRON_FULLNODE_RPC }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'discover' }}"
          PROVIDER="${{ matrix.provider }}"
          # If the dispatcher pinned a single provider, skip the others.
          PINNED="${{ github.event.inputs.provider }}"
          if [ -n "$PINNED" ] && [ "$PINNED" != "$PROVIDER" ]; then
            echo "Skipping $PROVIDER (dispatcher pinned $PINNED)"
            exit 0
          fi
          echo "Syncing ${PROVIDER} in ${MODE} mode..."
          npx tsx scripts/sync-feeds.ts --mode="${MODE}" --provider="${PROVIDER}"
