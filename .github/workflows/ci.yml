name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Commit expected by an automated publisher (empty for manual runs)'
        required: false
        type: string

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-impact:
    name: Classify runtime impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.impact.outputs.runtime }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
      - name: Determine whether this change can affect the running web app
        id: impact
        env:
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$CHANGE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            # workflow_dispatch and a first push have no reliable comparison.
            # Treat them as runtime-impacting rather than risk a skipped gate.
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${CHANGE_BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$CHANGE_BASE_SHA"
          fi
          node scripts/determine-runtime-impact.mts

  validate-static:
    name: Static, protocol, and SDK checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Next builds in production mode and validates required configuration while
    # collecting route metadata. Use inert CI-only values: the build has no
    # reason to contact Supabase, and production secrets must never enter CI.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      INTERNAL_API_SECRET: ci-internal-secret-that-is-not-used-in-production
      CSRF_SECRET: ci-csrf-secret-that-is-not-used-in-production
      JWT_SECRET: ci-jwt-secret-that-is-not-used-in-production
      PROTOCOL_GOVERNANCE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify the dispatched commit
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ "$EXPECTED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Dispatch resolved to $GITHUB_SHA instead of $EXPECTED_SHA"
            exit 1
          fi
      - name: Fetch force-push governance base
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          if ! git cat-file -e "${PROTOCOL_GOVERNANCE_BASE}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$PROTOCOL_GOVERNANCE_BASE"
          fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      # Generated bundles are deterministic repository outputs. Check them
      # before the expensive verifier and replay work, so contributors get a
      # fast, actionable failure instead of waiting through unrelated gates.
      - name: Reject stale generated cron bundles
        run: npm run validate:generated
      - name: Check the documented offline verifier example
        run: |
          npm run build --prefix verifier
          node verifier/examples/quickstart.mjs --offline
      - name: Verify the packed standalone verifier and pinned offline CLI
        run: npm run verifier:release:check
      - name: Verify scenario-test receipts against the packed verifier
        run: npm run oracle:test:verifier-e2e
      - name: Replay captured Oracle Watch observations offline
        # Skips by design when no snapshot file is supplied: snapshots are
        # captured observations rather than repo fixtures, so CI has none.
        # Only a replay that actually disagreed fails this step.
        run: npm run oracle:test:replay-check
      - name: Reject mutable or bypassing workflow configuration
        run: npm run workflow:check
      - name: Enforce pinned RWA source and frozen-vector integrity
        run: npm run rwa:parity
      - name: Enforce main-only protocol isolation
        run: npm run protocol:check
      # ESLint's cache is content-addressed per file, so a cache published by
      # main lets a pull request re-lint only the files it actually touched.
      # The key pins the config and lockfile, so a rule or dependency change can
      # never be answered from a stale cache.
      - name: Restore ESLint cache
        id: eslint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', 'package-lock.json', 'tsconfig.json') }}
      - name: Run remaining static validation checks
        # Bounded parallelism: the default (cores - 2) is too conservative on
        # the 4-core CI runner for these mostly-single-threaded checks.
        env:
          CHECKS_PARALLEL_LIMIT: 4
        run: npm run validate:ci:static
      # Publish only from main so pull-request refs stop accumulating
      # unreachable copies of the same cache.
      - name: Save ESLint cache
        if: github.ref == 'refs/heads/main' && steps.eslint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', 'package-lock.json', 'tsconfig.json') }}

  validate-tests:
    name: Unit coverage tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      INTERNAL_API_SECRET: ci-internal-secret-that-is-not-used-in-production
      CSRF_SECRET: ci-csrf-secret-that-is-not-used-in-production
      JWT_SECRET: ci-jwt-secret-that-is-not-used-in-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      # The test suite can import the packed verifier through the same boundary
      # as the static type checks. Build it in this independent job as well.
      - run: npm run build --prefix verifier
      # Jest's transform cache is content-addressed, so restoring it can only
      # save re-transforms; changed files are recomputed automatically.
      - name: Restore Jest transform cache
        id: jest-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'jest.config.js', 'jest.setup.ts') }}
      - name: Run coverage tests
        # 75% left one of the runner's four cores idle while this job was the
        # longest pole; 100% uses the whole box and still restarts idle workers
        # through workerIdleMemoryLimit.
        run: npm run test:coverage -- --maxWorkers=100%
      - name: Save Jest transform cache
        if: github.ref == 'refs/heads/main' && steps.jest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'jest.config.js', 'jest.setup.ts') }}

  # Script-level reliability tests are independent of the Jest suite, so they
  # get their own runner instead of extending the critical path behind coverage.
  validate-reliability:
    name: Reliability tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      INTERNAL_API_SECRET: ci-internal-secret-that-is-not-used-in-production
      CSRF_SECRET: ci-csrf-secret-that-is-not-used-in-production
      JWT_SECRET: ci-jwt-secret-that-is-not-used-in-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run build --prefix verifier
      - name: Run reliability tests
        run: npm run test:reliability

  # Keep the historical required-check name. This status only passes after all
  # independent validation paths pass, so branch protection cannot be bypassed
  # while they run concurrently.
  validate:
    needs: [validate-static, validate-tests, validate-reliability]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation path to pass
        env:
          STATIC_RESULT: ${{ needs.validate-static.result }}
          TEST_RESULT: ${{ needs.validate-tests.result }}
          RELIABILITY_RESULT: ${{ needs.validate-reliability.result }}
        run: |
          if [ "$STATIC_RESULT" != 'success' ] || [ "$TEST_RESULT" != 'success' ] || [ "$RELIABILITY_RESULT" != 'success' ]; then
            echo "::error::Validation paths finished with static=$STATIC_RESULT tests=$TEST_RESULT reliability=$RELIABILITY_RESULT"
            exit 1
          fi

  smoke:
    needs: runtime-impact
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    # Chromium and its system libraries are baked into the official Playwright
    # image, so the job no longer runs `playwright install-deps` against the
    # runner's apt mirror. Keep this tag (and its digest) in lockstep with the
    # @playwright/test version in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      INTERNAL_API_SECRET: ci-internal-secret-that-is-not-used-in-production
      CSRF_SECRET: ci-csrf-secret-that-is-not-used-in-production
      JWT_SECRET: ci-jwt-secret-that-is-not-used-in-production
      # The homepage budget check must hard-fail here when it cannot locate the
      # prerendered homepage, so a Next.js output-layout change cannot quietly
      # drop the gate. Deploy targets only warn (see the script).
      HOME_JS_BUDGET_REQUIRE_ARTIFACT: '1'
    steps:
      - name: Require a successful runtime-impact classification
        if: needs.runtime-impact.result != 'success'
        run: |
          echo "::error::Unable to classify the change; refusing to skip browser verification."
          exit 1
      - name: Skip browser smoke for non-runtime-only changes
        if: needs.runtime-impact.outputs.runtime != 'true'
        run: echo "Only docs, GitHub automation, or repository metadata changed."
      - if: needs.runtime-impact.outputs.runtime == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - if: needs.runtime-impact.outputs.runtime == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          cache: npm
      - if: needs.runtime-impact.outputs.runtime == 'true'
        run: npm ci
      # Fail fast with an explicit message if the image no longer carries the
      # Chromium revision that this @playwright/test version expects, instead
      # of discovering it inside the e2e run.
      - name: Verify the image Chromium matches the pinned Playwright
        if: needs.runtime-impact.outputs.runtime == 'true'
        run: |
          node -e '
          const { chromium } = require("@playwright/test");
          (async () => {
            const expected = "/ms-playwright";
            if (process.env.PLAYWRIGHT_BROWSERS_PATH !== expected) {
              throw new Error(
                "Expected PLAYWRIGHT_BROWSERS_PATH=" + expected + ", got " + process.env.PLAYWRIGHT_BROWSERS_PATH
              );
            }
            const browser = await chromium.launch({ headless: true });
            console.log("Chromium " + browser.version() + " launched from " + chromium.executablePath());
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          '
      - name: Restore Next.js build cache
        if: needs.runtime-impact.outputs.runtime == 'true'
        id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          # Next invalidates changed source entries itself.  Keeping this key at
          # dependency granularity makes the incremental cache a true hit for
          # every commit with the same dependency graph, rather than only for
          # an explicit re-run of the same SHA.
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          # A dependency bump must not force a cold production build: Next
          # validates every entry against the source it produced, so falling
          # back to the previous cache only costs the modules that changed.
          restore-keys: |
            nextjs-${{ runner.os }}-
      - if: needs.runtime-impact.outputs.runtime == 'true'
        run: npm run build
      - name: Cache Next.js build state
        if: github.ref == 'refs/heads/main' && needs.runtime-impact.outputs.runtime == 'true' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Verify the packed package shape in Chromium without network
        if: needs.runtime-impact.outputs.runtime == 'true'
        run: npm run verifier:release:check -- --browser
      - if: needs.runtime-impact.outputs.runtime == 'true'
        run: npm run test:e2e -- --project=chromium
      - name: Retain browser failure evidence
        if: failure() && needs.runtime-impact.outputs.runtime == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chromium-smoke-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  # Production release lives in `.github/workflows/deploy-production.yml`.
  #
  # It is a separate workflow because this file's top-level `concurrency`
  # (`cancel-in-progress: true`) cancels the whole run when a newer push arrives.
  # That is correct for quality checks and fatal for a release: cancellation
  # skips every later step, including the automatic rollback. The release workflow
  # keeps the same gates (runtime-impact classification, the merged-PR evidence
  # check, the protected `production` environment) and adds the rollback that
  # this job could never guarantee.
