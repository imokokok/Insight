name: Rebuild cron bundles

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to rebuild the bundles on'
        required: true
        default: 'main'
      commit_message:
        description: 'Commit message for the rebuilt bundles'
        required: false
        default: 'chore(cron): rebuild bundles from a clean npm ci environment'

permissions:
  contents: write

concurrency:
  group: rebuild-cron-bundles-${{ github.event.inputs.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the target ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild cron bundles
        run: npm run build:cron

      - name: Commit rebuilt bundles if changed
        run: |
          if git diff --quiet; then
            echo 'Cron bundles already match a clean npm ci rebuild; nothing to commit.'
            exit 0
          fi
          git config user.name 'imokokok'
          git config user.email '145034722+imokokok@users.noreply.github.com'
          unexpected="$(git diff --name-only -- . ':(exclude).github/cron-dist')"
          if [ -n "$unexpected" ]; then
            echo "::error::rebuild changed files outside cron-dist: $unexpected"
            exit 1
          fi
          git add .github/cron-dist
          git commit -m "${{ github.event.inputs.commit_message }}"
          git push
