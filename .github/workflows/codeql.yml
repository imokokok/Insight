name: CodeQL

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'

# Rapid successive pushes to main each spawn a 3-4 minute analysis run; keep
# only the latest so overlapping pushes do not queue redundant runners. The
# final head SHA is always analyzed to completion.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
