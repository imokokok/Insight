name: cf restore priorseal dns

# One-shot repair: the priorseal.xyz Workers Custom Domain DNS records
# disappeared from the Cloudflare zone (authoritative NS answers SOA but no
# A records), taking priorseal.xyz off the internet. Re-attaching the custom
# domains via the Workers Domains API recreates the DNS records. Run manually
# with workflow_dispatch. Remove both temporary secrets afterwards.
#
# Two credentials:
#   - CLOUDFLARE_API_TOKEN (account API token): verified OK but lacks
#     Workers Custom Domains / DNS permissions (CF error 9106).
#   - CLOUDFLARE_OAUTH_TOKEN (wrangler OAuth): has workers_routes write and
#     performs the actual attach.

on:
  workflow_dispatch:

concurrency:
  group: cf-restore-priorseal-dns
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_OAUTH_TOKEN: ${{ secrets.CLOUDFLARE_OAUTH_TOKEN }}
  CF_API: https://api.cloudflare.com/client/v4
  CF_ACCOUNT_ID: f7f2f006794867870d3dffb22abafaf3
  CF_ZONE_ID: 0990d9fc04b83fc5f672fac00dfd0ba3
  CF_ZONE_NAME: priorseal.xyz
  WORKER_SERVICE: priorseal

jobs:
  restore:
    name: Re-attach Workers custom domains (recreates DNS records)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Attach custom domains via wrangler OAuth token
        run: |
          set -euo pipefail
          echo "=== attach priorseal.xyz ==="
          curl -sS -X PUT "$CF_API/accounts/$CF_ACCOUNT_ID/workers/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_OAUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"zone_id\":\"$CF_ZONE_ID\",\"hostname\":\"priorseal.xyz\",\"service\":\"$WORKER_SERVICE\",\"environment\":\"production\"}" \
            > /tmp/attach-apex.json
          head -c 500 /tmp/attach-apex.json; echo
          echo "=== attach www.priorseal.xyz ==="
          curl -sS -X PUT "$CF_API/accounts/$CF_ACCOUNT_ID/workers/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_OAUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"zone_id\":\"$CF_ZONE_ID\",\"hostname\":\"www.priorseal.xyz\",\"service\":\"$WORKER_SERVICE\",\"environment\":\"production\"}" \
            > /tmp/attach-www.json
          head -c 500 /tmp/attach-www.json; echo
          python3 - << 'EOF'
          import json
          ok = True
          for f in ['/tmp/attach-apex.json', '/tmp/attach-www.json']:
              try:
                  d = json.load(open(f))
                  if not d.get('success'):
                      ok = False
                      print(f, 'ERR:', d.get('errors'))
                  else:
                      r = d['result']
                      print(f, 'OK:', r.get('hostname'), '->', r.get('service'), r.get('status'))
              except Exception as e:
                  ok = False
                  print(f, 'PARSE-ERR:', e)
          if not ok:
              raise SystemExit('custom domain attach failed')
          EOF

      - name: Verify DNS restored
        run: |
          set -euo pipefail
          sleep 20
          echo "=== zone dns records after attach ==="
          curl -sS "$CF_API/zones/$CF_ZONE_ID/dns_records?per_page=100" -H "Authorization: Bearer $CLOUDFLARE_OAUTH_TOKEN" > /tmp/dns-after.json || true
          python3 -c "
          import json
          try:
              d = json.load(open('/tmp/dns-after.json'))
              if not d.get('success'): print('ERR:', d.get('errors'))
              for r in d.get('result') or []:
                  print(r['type'], r['name'], '->', str(r['content'])[:60])
          except Exception as e:
              print('dns read skipped:', e)
          " || true
          echo "=== public resolution ==="
          sleep 15
          for H in priorseal.xyz www.priorseal.xyz; do
            echo "$H via 1.1.1.1: $(dig +short $H @1.1.1.1 | tr '\n' ' ')"
          done
          echo "=== https health ==="
          curl -sS -o /dev/null -w "priorseal.xyz/health: %{http_code}\n" --max-time 20 https://priorseal.xyz/health || true
          curl -sS -o /dev/null -w "www.priorseal.xyz/health: %{http_code}\n" --max-time 20 https://www.priorseal.xyz/health || true
