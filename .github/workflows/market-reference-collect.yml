name: Market Reference Collect

# External truth layer collection: independent CEX spot prices for the Oracle
# Watch universe, every 15 minutes, running DIRECTLY on the GitHub runner
# (escapes Vercel's 60s serverless timeout — same pattern as snapshot-collect).
#
# Writes one row per (symbol, exchange, snapshot_ts) to
# `market_reference_snapshots` (migration 0037). Fail-closed: a symbol with
# zero successful quotes yields only failed rows, never an estimated price.
# Cross-exchange consistency is read from the `market_reference_hourly` view.
#
# Binance (api.binance.com) is geo-blocked in some runner regions and is
# collected best-effort; Coinbase + Kraken are the dependable pair.

on:
  schedule:
    # Every 15 minutes at :00,:15,:30,:45
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: market-reference-collect
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets are required."
            exit 1
          fi

      - name: Collect market reference
        run: npx tsx scripts/collect-market-reference.ts
