name: Market Reference Collect

# Manual fallback for external-truth-layer collection. The REAL 15-min cadence
# runs inside snapshot-collect.yml (step "Collect market reference") because
# GitHub Actions did not register this file's `schedule` cron (0 scheduled runs
# after hours; only workflow_dispatch fired). Keep this as a manual trigger for
# one-off catch-up runs.
#
# Sources: Coinbase, Kraken, Gemini, Crypto.com (WBTC/USD only), plus optional
# licensed Bitstamp/Bitfinex/Binance sources. Binance WBTC uses the dedicated
# public market-data endpoint and a verified WBTC/USDT × USDT/USD conversion.
# Set the repository variable
# MARKET_REFERENCE_LICENSED_EXCHANGES only after written commercial data rights
# are confirmed and migration 0087 has been applied. Gemini replaced Binance,
# whose standard API returns HTTP 451 on GitHub US runners; the dedicated
# market-data endpoint still requires an Actions-runner availability check.

on:
  workflow_dispatch:

concurrency:
  group: market-reference-collect
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  MARKET_REFERENCE_LICENSED_EXCHANGES: ${{ vars.MARKET_REFERENCE_LICENSED_EXCHANGES }}

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify required secrets
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets are required."
            exit 1
          fi

      - name: Collect market reference
        run: node .github/cron-dist/collect-market-reference.mjs
