name: Market Reference Collect

# Manual fallback for external-truth-layer collection. The REAL 15-min cadence
# runs inside snapshot-collect.yml (step "Collect market reference") because
# GitHub Actions did not register this file's `schedule` cron (0 scheduled runs
# after hours; only workflow_dispatch fired). Keep this as a manual trigger for
# one-off catch-up runs.
#
# Sources: coinbase + kraken + gemini (all US-runner-safe public APIs; Gemini
# replaced Binance, which returns HTTP 451 on GitHub US runners).

on:
  workflow_dispatch:

concurrency:
  group: market-reference-collect
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets are required."
            exit 1
          fi

      - name: Collect market reference
        run: npx tsx scripts/collect-market-reference.ts
