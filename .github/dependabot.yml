version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      # Updated, tested, committed, and deployed by sync-npm-releases.yml.
      - dependency-name: verify-insight-receipt
      # Major upgrades need focused compatibility work instead of blocking every
      # safe update in a large grouped pull request.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      # Prettier 3.9 changes the repository's formatting output and needs a
      # dedicated source-format migration instead of blocking the dev group.
      - dependency-name: prettier
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Major action runtime upgrades require focused review; immutable SHAs are
      # still refreshed for safe releases within the currently selected major.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
